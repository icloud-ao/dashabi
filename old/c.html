<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>C语言综合练习</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #111827;
    --panel2: #0f172a;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: rgba(255,255,255,.10);
    --ok: #10b981;
    --bad: #ef4444;
    --warn: #f59e0b;
    --link: #60a5fa;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #0b0f14 0%, #090d12 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
    line-height: 1.45;
  }
  a { color: var(--link); }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 16px 96px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(10px);
    background: rgba(11,15,20,.7);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .sub {
    color: var(--muted);
    font-size: 12px;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ctrl {
    background: rgba(17,24,39,.75);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .ctrl-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
  }
  .pill {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    background: rgba(15,23,42,.6);
  }
  .pill strong { color: var(--text); font-weight: 700; }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(15,23,42,.8);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: transform .04s ease, border-color .12s ease;
  }
  .btn:hover { border-color: rgba(255,255,255,.22); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: rgba(59,130,246,.25);
    border-color: rgba(59,130,246,.5);
  }
  .btn.danger {
    background: rgba(239,68,68,.18);
    border-color: rgba(239,68,68,.45);
  }
  .btn.ghost {
    background: rgba(17,24,39,.45);
  }
  .input {
    width: 100%;
    background: rgba(15,23,42,.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .input:focus { border-color: rgba(96,165,250,.65); }
  .section {
    margin-top: 18px;
  }
  .section h2 {
    margin: 18px 0 10px;
    font-size: 15px;
    color: #f3f4f6;
  }
  .q {
    background: rgba(17,24,39,.70);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin: 10px 0;
    box-shadow: var(--shadow);
  }
  .q.correct { border-color: rgba(16,185,129,.55); }
  .q.wrong { border-color: rgba(239,68,68,.55); }
  .q.unanswered { border-color: rgba(245,158,11,.55); }
  .q-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }
  .q-title {
    font-weight: 700;
    font-size: 13px;
  }
  .q-meta {
    color: var(--muted);
    font-size: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .tag {
    border: 1px solid var(--border);
    background: rgba(15,23,42,.55);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
  }
  .tag.ok { border-color: rgba(16,185,129,.55); color: #a7f3d0; }
  .tag.bad { border-color: rgba(239,68,68,.55); color: #fecaca; }
  .tag.warn { border-color: rgba(245,158,11,.55); color: #fde68a; }
  .stem {
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
  }
  .options {
    margin-top: 10px;
    display: grid;
    gap: 8px;
  }
  .opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(15,23,42,.55);
    cursor: pointer;
    user-select: none;
  }
  .opt:hover { border-color: rgba(255,255,255,.22); }
  .opt input { margin-top: 2px; }
  .opt .letter {
    width: 20px;
    font-weight: 800;
    color: #c7d2fe;
  }
  .opt .text {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    color: #e5e7eb;
  }
  .opt.correct {
    border-color: rgba(16,185,129,.65);
    background: rgba(16,185,129,.10);
  }
  .opt.wrong {
    border-color: rgba(239,68,68,.65);
    background: rgba(239,68,68,.10);
  }
  .answer-line {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    display: none;
  }
  .answer-line.show { display: block; }
  .answer-line b { color: #f3f4f6; }
  
  .stem.code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  }

    display: inline-block;

    max-width: 100%;
    padding: 6px 8px;
    margin: 2px 2px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.04);
    color: var(--fg);
    outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 13px;
  }

  .blank-input.wrong { border-color: rgba(239,68,68,.85); box-shadow: 0 0 0 4px rgba(239,68,68,.18); }
.bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: rgba(11,15,20,.78);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
  }
  .bottom-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
  }
  .status b { color: var(--text); }
  .right-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }
  .note {
    color: var(--muted);
    font-size: 12px;
    margin: 8px 0 0;
  }
  @media (max-width: 720px) {
    .controls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="title-row">
      <div>
        <h1>综合练习2</h1>
        <div class="sub">本页面会把作答自动保存到本机浏览器（localStorage）。可离线打开。</div>
      </div>
      <div class="stats" id="statsTop"></div>
    </div>

    <div class="controls">
      <div class="ctrl">

      <div class="ctrl">
        <div class="ctrl-row">

      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <div class="divider"></div>

  <div class="section" id="secJudge">
    <h2>判断题（共 36 题）</h2>
    <div id="judgeList"></div>
  </div>

  <div class="divider"></div>

  <div class="section" id="secSingle">
    <h2>单选题（共 67 题）</h2>
    <div id="singleList"></div>
  </div>
  
  <div class="section" id="secBlank">
    <h2>程序填空题（共 11 题）</h2>

  </div>
  <p class="note">题目与答案来自你上传的文本整理（程序填空 11 + 判断题 36 + 单选题 67）。</p>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="status" id="statusBar">未判分</div>
    <div class="right-buttons">

      <button class="btn" id="btnClear">清空选择</button>
      <button class="btn danger" id="btnReset">清空本页所有保存</button>
    </div>
  </div>
</div>

  const LS_KEY = "quiz_autograde_v1_" + (DATA.meta?.title || "quiz");

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)) {
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null) continue;
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    }
    return e;
  }

  function loadState() {
    try {
      return JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    } catch {
      return {};
    }
  }
  function saveState(state) {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setStatus("已自动保存", false);
  }

  function setStatus(msg, sticky) {
    const bar = document.getElementById("statusBar");
    const t = new Date();
    const hh = String(t.getHours()).padStart(2,"0");
    const mm = String(t.getMinutes()).padStart(2,"0");
    bar.innerHTML = `<b>${esc(msg)}</b> · ${hh}:${mm}`;
    if (!sticky) {
      clearTimeout(setStatus._tm);
      setStatus._tm = setTimeout(() => {
        bar.innerHTML = bar.innerHTML.replace(/<b>.*?<\/b>/, "<b>未判分</b>");
      }, 1500);
    }
  }

  function render() {
    const state = loadState();
    const blankList = document.getElementById("blankList");
    const judgeList = document.getElementById("judgeList");
    const singleList = document.getElementById("singleList");
    if (blankList) blankList.innerHTML = "";
    judgeList.innerHTML = "";
    singleList.innerHTML = "";

    // 判分缓存
    const lastGrade = state._grade || null;

    // 程序填空题
    for (const q of (DATA.blank || [])) {
      const qid = q.id || `B${q.num}`;
      const saved = Array.isArray(state[qid]) ? state[qid] : [];
      const qBox = el("div", {class:"q", id:`q-${qid}`});
      const head = el("div", {class:"q-head"}, [
        el("div", {class:"q-title"}, [`填空 ${q.num}`]),
        el("div", {class:"q-meta"}, [
          el("span", {class:"tag"}, [`${(q.answers || []).length}空`]),
          el("span", {class:"tag warn", id:`tag-${qid}`}, ["未判分"]),
        ])
      ]);

      const stem = el("div", {class:"stem code"});
      const parts = String(q.stem || "").split("[[blank]]");
      parts.forEach((part, i) => {
        stem.appendChild(document.createTextNode(part));
        if (i < parts.length - 1) {
          const input = el("input", {
            class: "blank-input",
            type: "text",
            value: (saved[i] ?? ""),
            placeholder: `填空#${i+1}`,
            spellcheck: "false",
            autocomplete: "off",
            "data-idx": String(i)
          });
          input.addEventListener("input", () => {
            const st = loadState();
            const arr = Array.isArray(st[qid]) ? st[qid] : [];
            arr[i] = input.value;
            st[qid] = arr;
            delete st._grade;
            saveState(st);

            // 取消判分标记
            const box = document.getElementById(`q-${qid}`);
            if (box) box.classList.remove("correct","wrong","unanswered");
            const tag = document.getElementById(`tag-${qid}`);
            if (tag) { tag.className = "tag warn"; tag.textContent = "未判分"; }

            input.classList.remove("correct","wrong");
          });
          stem.appendChild(input);
        }
      });

      const ansLine = el("div", {class:"answer-line", id:`ans-${qid}`});
      const ans = (q.answers || []).map((a, i) => `填空#${i+1}：<b>${esc(a)}</b>`).join("<br>");
      ansLine.innerHTML = ans ? `参考答案：<br>${ans}` : "";

      qBox.appendChild(head);
      qBox.appendChild(stem);
      qBox.appendChild(ansLine);

      if (blankList) blankList.appendChild(qBox);
    }

    // 判断题
    for (const q of DATA.judge) {
      const qid = `J${q.num}`;
      const chosen = state[qid] ?? "";
      const qBox = el("div", {class:"q", id:`q-${qid}`});
      const head = el("div", {class:"q-head"}, [
        el("div", {class:"q-title"}, [`判断 ${q.num}`]),
        el("div", {class:"q-meta"}, [
          el("span", {class:"tag"}, ["1分"]),
          el("span", {class:"tag warn", id:`tag-${qid}`}, ["未判分"]),
        ])
      ]);
      const stem = el("div", {class:"stem", html: esc(q.stem)});

      const opts = el("div", {class:"options"});
      for (const letter of ["T","F"]) {
        const name = `ans-${qid}`;
        const optId = `${qid}-${letter}`;
        const labelText = (letter === "T" ? "正确 (T)" : "错误 (F)");
        const opt = el("label", {class:"opt", for:optId});
        const radio = el("input", {
          type: "radio",
          name,
          id: optId,
          value: letter
        });
        radio.checked = (chosen === letter);
        radio.addEventListener("change", () => {
          const st = loadState();
          st[qid] = letter;
          // 作答变更后，清掉之前判分结果
          delete st._grade;
          saveState(st);
          applyChoiceVisual(qid, st[qid]);
          refreshTopStats();
        });
        opt.appendChild(radio);
        opt.appendChild(el("div", {class:"letter"}, [letter]));
        opt.appendChild(el("div", {class:"text"}, [labelText]));
        opts.appendChild(opt);
      }

      const ansLine = el("div", {class:"answer-line", id:`ans-${qid}`});
      ansLine.innerHTML = `正确答案：<b>${esc(q.answer)}</b>`;

      qBox.appendChild(head);
      qBox.appendChild(stem);
      qBox.appendChild(opts);
      qBox.appendChild(ansLine);

      judgeList.appendChild(qBox);
    }

    // 单选题
    for (const q of DATA.single) {
      const qid = `S${q.num}`;
      const chosen = state[qid] ?? "";
      const qBox = el("div", {class:"q", id:`q-${qid}`});
      const head = el("div", {class:"q-head"}, [
        el("div", {class:"q-title"}, [`单选 ${q.num}`]),
        el("div", {class:"q-meta"}, [
          el("span", {class:"tag"}, ["1分"]),
          el("span", {class:"tag warn", id:`tag-${qid}`}, ["未判分"]),
        ])
      ]);
      const stem = el("div", {class:"stem", html: esc(q.stem)});

      const opts = el("div", {class:"options"});
      for (const letter of ["A","B","C","D"]) {
        const name = `ans-${qid}`;
        const optId = `${qid}-${letter}`;
        const opt = el("label", {class:"opt", for:optId});
        const radio = el("input", {
          type: "radio",
          name,
          id: optId,
          value: letter
        });
        radio.checked = (chosen === letter);
        radio.addEventListener("change", () => {
          const st = loadState();
          st[qid] = letter;
          delete st._grade;
          saveState(st);
          applyChoiceVisual(qid, st[qid]);
          refreshTopStats();
        });
        opt.appendChild(radio);
        opt.appendChild(el("div", {class:"letter"}, [letter]));
        opt.appendChild(el("div", {class:"text"}, [q.options[letter]]));
        opts.appendChild(opt);
      }

      const ansLine = el("div", {class:"answer-line", id:`ans-${qid}`});
      ansLine.innerHTML = `正确答案：<b>${esc(q.answer)}</b>${q.note ? ` <span style="color:#9ca3af">（${esc(q.note)}）</span>` : ""}`;

      qBox.appendChild(head);
      qBox.appendChild(stem);
      qBox.appendChild(opts);
      qBox.appendChild(ansLine);

      singleList.appendChild(qBox);
    }

    // 应用之前判分结果（如果有）
    if (lastGrade) {
      applyGrade(lastGrade, /*showToast*/ false);
    }

    refreshTopStats();
    applyAnswerVisibility(state._showAnswers === true);
  }

  function applyChoiceVisual(qid, chosen) {
    // 仅刷新 qid 对应题目，不做判分
    const box = document.getElementById(`q-${qid}`);
    if (!box) return;
    box.classList.remove("correct","wrong","unanswered");
    const tag = document.getElementById(`tag-${qid}`);
    if (tag) {
      tag.className = "tag warn";
      tag.textContent = "未判分";
    }
    // 清理选项的正确/错误标记
    box.querySelectorAll(".opt").forEach(o => o.classList.remove("correct","wrong"));
  }

  function gradeNow() {
    const st = loadState();
    let total = 0, got = 0;
    let judgeTotal = 0, judgeGot = 0;
    let singleTotal = 0, singleGot = 0;
    let blankTotal = 0, blankGot = 0;
    const per = {};

    // 填空（按“空”计分）
    for (const q of (DATA.blank || [])) {
      const qid = q.id || `B${q.num}`;
      const chosenArr = Array.isArray(st[qid]) ? st[qid] : [];
      const correctArr = (q.answers || []);
      const blanks = [];
      let anyFilled = false;
      let gotPts = 0;

      for (let i = 0; i < correctArr.length; i++) {
        const c = String(chosenArr[i] ?? "").trim();
        const a = String(correctArr[i] ?? "").trim();
        if (c !== "") anyFilled = true;
        let s = "unanswered";
        if (c !== "") {
          s = (c === a) ? "correct" : "wrong";
        }
        blanks.push(s);
        if (s === "correct") gotPts++;
      }

      blankTotal += correctArr.length; total += correctArr.length;
      blankGot += gotPts; got += gotPts;

      const status = anyFilled ? (gotPts === correctArr.length ? "correct" : "wrong") : "unanswered";
      per[qid] = { chosen: chosenArr, correct: correctArr, status, blanks, gotPts, totalPts: correctArr.length };
    }

    // judge
    for (const q of DATA.judge) {
      const qid = `J${q.num}`;
      judgeTotal++; total++;
      const chosen = st[qid] ?? "";
      const correct = q.answer;
      const status = chosen ? (chosen === correct ? "correct" : "wrong") : "unanswered";
      if (status === "correct") { judgeGot++; got++; }
      per[qid] = { chosen, correct, status };
    }

    // single
    for (const q of DATA.single) {
      const qid = `S${q.num}`;
      singleTotal++; total++;
      const chosen = st[qid] ?? "";
      const correct = q.answer;
      const status = chosen ? (chosen === correct ? "correct" : "wrong") : "unanswered";
      if (status === "correct") { singleGot++; got++; }
      per[qid] = { chosen, correct, status };
    }

    const grade = {
      total, got,
      judgeTotal, judgeGot,
      singleTotal, singleGot,
      blankTotal, blankGot,
      per
    };

    st._grade = grade;
    saveState(st);
    applyGrade(grade, true);
    refreshTopStats();
  }

  function applyGrade(grade, showToast) {
    for (const [qid, info] of Object.entries(grade.per || {})) {
      const box = document.getElementById(`q-${qid}`);
      if (!box) continue;
      box.classList.remove("correct","wrong","unanswered");
      box.classList.add(info.status);

      const tag = document.getElementById(`tag-${qid}`);
      if (tag) {
        tag.classList.remove("ok","bad","warn");
        if (info.status === "correct") {
          tag.className = "tag ok";
          tag.textContent = "正确";
        } else if (info.status === "wrong") {
          // 填空题显示分数（按空计）
          if (Array.isArray(info.blanks) && typeof info.gotPts === "number") {
            tag.className = "tag bad";
            tag.textContent = `${info.gotPts}/${info.totalPts}`;
          } else {
            tag.className = "tag bad";
            tag.textContent = "错误";
          }
        } else {
          tag.className = "tag warn";
          tag.textContent = "未答";
        }
      }

      // 标注选项（判断/单选）
      box.querySelectorAll(".opt").forEach(opt => {
        opt.classList.remove("correct","wrong");
        const radio = opt.querySelector("input[type=radio]");
        if (!radio) return;
        const v = radio.value;
        if (v === info.correct) opt.classList.add("correct");
        if (info.chosen && v === info.chosen && info.chosen !== info.correct) opt.classList.add("wrong");
      });

      // 标注填空
      if (Array.isArray(info.blanks)) {
        box.querySelectorAll(".blank-input").forEach((inp, idx) => {
          inp.classList.remove("correct","wrong");
          const s = info.blanks[idx];
          if (s === "correct") inp.classList.add("correct");
          if (s === "wrong") inp.classList.add("wrong");
        });
      }
    }

    const msg = `总分 ${grade.total}，得分 ${grade.got}（填空 ${grade.blankGot}/${grade.blankTotal}，判断 ${grade.judgeGot}/${grade.judgeTotal}，单选 ${grade.singleGot}/${grade.singleTotal}）`;
    document.getElementById("statusBar").innerHTML = `<b>${esc(msg)}</b>`;
    if (showToast) {
      setStatus(msg, true);
    }
  }

  function refreshTopStats() {
    const st = loadState();
    const g = st._grade;

    const judgeAnswered = DATA.judge.filter(q => (st[`J${q.num}`] ?? "") !== "").length;
    const singleAnswered = DATA.single.filter(q => (st[`S${q.num}`] ?? "") !== "").length;
    const blankAnswered = (DATA.blank || []).filter(q => {
      const qid = q.id || `B${q.num}`;
      const v = st[qid];
      if (!Array.isArray(v)) return false;
      return v.some(x => String(x ?? "").trim() !== "");
    }).length;

    const totalAnswered = judgeAnswered + singleAnswered + blankAnswered;
    const total = DATA.judge.length + DATA.single.length + (DATA.blank || []).length;

    const top = document.getElementById("statsTop");
    const score = g ? `得分 <strong>${g.got}</strong>/${g.total}` : "未判分";
    top.innerHTML = `
      <span class="pill">进度 <strong>${totalAnswered}</strong>/${total}</span>

      <span class="pill">判断 <strong>${judgeAnswered}</strong>/${DATA.judge.length}</span>
      <span class="pill">单选 <strong>${singleAnswered}</strong>/${DATA.single.length}</span>
      <span class="pill">填空 <strong>${blankAnswered}</strong>/${(DATA.blank || []).length}</span>
      <span class="pill">${score}</span>
    `;
  }

  function applyAnswerVisibility(show) {
    document.querySelectorAll(".answer-line").forEach(e => {
      e.classList.toggle("show", show);
    });
    document.getElementById("btnToggleAnswers").textContent = show ? "隐藏答案" : "显示答案";
  }

  function clearChoices() {
    const st = loadState();
    for (const q of (DATA.blank || [])) delete st[q.id || `B${q.num}`];
    for (const q of DATA.judge) delete st[`J${q.num}`];
    for (const q of DATA.single) delete st[`S${q.num}`];
    delete st._grade;
    saveState(st);
    render();
  }

  function resetAll() {
    localStorage.removeItem(LS_KEY);
    render();
    setStatus("已清空本页所有保存", true);
  }

  function scrollToQ(qid) {
    const elQ = document.getElementById(`q-${qid}`);
    if (elQ) elQ.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function filterShow(mode) {
    const st = loadState();
    const g = st._grade;
    const all = document.querySelectorAll(".q");
    all.forEach(x => x.style.display = "");
    if (!mode) return;

    if (mode === "unanswered") {
      all.forEach(box => {
        const id = box.id.replace(/^q-/, "");
        const val = st[id];
        const answered = Array.isArray(val)
          ? val.some(x => String(x ?? "").trim() !== "")
          : !!val;
        if (answered) box.style.display = "none";
      });
      return;
    }

    // 需要判分结果：wrong
    if (!g) {
      setStatus("请先提交判分后再筛选", true);
      return;
    }

    if (mode === "wrong") {
      all.forEach(box => {
        const id = box.id.replace(/^q-/, "");
        const info = g.per?.[id];
        if (!info || info.status !== "wrong") box.style.display = "none";
      });
    }
  }

  // Events
  document.getElementById("btnGrade").addEventListener("click", gradeNow);
  document.getElementById("btnClear").addEventListener("click", clearChoices);
  document.getElementById("btnReset").addEventListener("click", resetAll);

  document.getElementById("btnToggleAnswers").addEventListener("click", () => {
    const st = loadState();
    st._showAnswers = !(st._showAnswers === true);
    saveState(st);
    applyAnswerVisibility(st._showAnswers === true);
  });

  document.getElementById("btnFilterUnanswered").addEventListener("click", () => filterShow("unanswered"));
  document.getElementById("btnFilterWrong").addEventListener("click", () => filterShow("wrong"));
  document.getElementById("btnShowAll").addEventListener("click", () => filterShow(null));

  document.getElementById("jumpInput").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const v = e.target.value.trim();
    if (!v) return;

    const mJudge = v.match(/^j(\d+)$/i);
    if (mJudge) {
      scrollToQ(`J${parseInt(mJudge[1],10)}`);
      return;
    }

    const mBlank = v.match(/^b(.+)$/i);
    if (mBlank) {
      const num = mBlank[1].trim();
      const q = (DATA.blank || []).find(x => String(x.num).toLowerCase() === num.toLowerCase());
      if (q) scrollToQ(q.id || `B${q.num}`);
      return;
    }

    // 允许直接输入如：5-3-2 / 5-10
    const mDash = v.match(/^(\d+)-(\d+)(?:-(\d+))?$/);
    if (mDash) {
      const num = v;
      const q = (DATA.blank || []).find(x => String(x.num) === num);
      if (q) scrollToQ(q.id || `B${q.num}`);
      return;
    }

    const mNum = v.match(/^(\d+)$/);
    if (mNum) {
      scrollToQ(`S${parseInt(mNum[1],10)}`);
      return;
    }
  });

  // Init
  render();
</script>
</body>
</html>
