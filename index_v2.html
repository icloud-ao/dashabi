<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>奥利奥の练习场</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png?v=2">
<style>
/* ==================== iOS 26/27 Liquid Glass 视觉引擎 ==================== */
:root {
  color-scheme: light dark;
  --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;

  /* 动态流体背景色与液态玻璃材质 (Light) */
  --bg-base: #eef1f8;
  --orb-1: rgba(0, 122, 255, 0.28);
  --orb-2: rgba(175, 82, 222, 0.24);
  --orb-3: rgba(50, 215, 75, 0.18);
  --orb-4: rgba(255, 149, 0, 0.18);

  --glass-bg: rgba(255, 255, 255, 0.62);
  --glass-bg-heavy: rgba(255, 255, 255, 0.78);
  --glass-pill: rgba(255, 255, 255, 0.52);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-edge: rgba(15, 23, 42, 0.07);
  --specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 1px rgba(255, 255, 255, 0.35);
  --shadow-spatial: 0 16px 40px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
  --shadow-float: 0 24px 60px -10px rgba(0, 60, 140, 0.18), 0 8px 20px rgba(0, 0, 0, 0.08);

  --ink: #0f172a;
  --mut: #64748b;
  --mut-soft: #94a3b8;

  --tc: #007aff;
  --tc-2: #5856d6;
  --ok: #34c759;
  --warn: #ff9500;
  --bad: #ff3b30;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-base: #05070f;
    --orb-1: rgba(10, 132, 255, 0.32);
    --orb-2: rgba(191, 90, 242, 0.26);
    --orb-3: rgba(48, 209, 88, 0.18);
    --orb-4: rgba(94, 92, 230, 0.28);

    --glass-bg: rgba(24, 28, 42, 0.56);
    --glass-bg-heavy: rgba(30, 35, 52, 0.75);
    --glass-pill: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-edge: rgba(255, 255, 255, 0.09);
    --specular: inset 0 1px 0.5px rgba(255, 255, 255, 0.25), inset 0 -1px 0.5px rgba(255, 255, 255, 0.05);
    --shadow-spatial: 0 20px 50px -10px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-float: 0 24px 64px rgba(0, 0, 0, 0.75), 0 0 0 0.5px rgba(255, 255, 255, 0.14);

    --ink: #f8fafc;
    --mut: #94a3b8;
    --mut-soft: #64748b;

    --tc: #0a84ff;
    --tc-2: #7d7aff;
    --ok: #30d158;
    --warn: #ff9f0a;
    --bad: #ff453a;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100dvh;
  background-color: var(--bg-base);
  color: var(--ink);
  font-family: var(--font-ios);
  line-height: 1.5;
  letter-spacing: -0.015em;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; border: 0; background: none; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ==================== 动态流体极光背景 (Aurora Mesh) ==================== */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: var(--bg-base);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(72px);
  opacity: 0.85;
  will-change: transform;
  animation: float-orb 18s ease-in-out infinite alternate;
}
.orb-1 { width: 420px; height: 420px; background: var(--orb-1); top: -120px; left: -80px; }
.orb-2 { width: 380px; height: 380px; background: var(--orb-2); top: 8%; right: -100px; animation-delay: -5s; animation-duration: 22s; }
.orb-3 { width: 340px; height: 340px; background: var(--orb-3); bottom: 12%; left: 10%; animation-delay: -9s; animation-duration: 25s; }
.orb-4 { width: 300px; height: 300px; background: var(--orb-4); bottom: -80px; right: 15%; animation-delay: -13s; }

@keyframes float-orb {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(30px, 40px, 0) scale(1.08); }
  100% { transform: translate3d(-25px, -30px, 0) scale(0.95); }
}

/* ==================== 液态玻璃公共混合类 ==================== */
.liquid-glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: saturate(200%) blur(32px);
  backdrop-filter: saturate(200%) blur(32px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--specular), var(--shadow-spatial);
}

/* ==================== 主体容器 ==================== */
.shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));
}

/* ==================== 顶部灵动岛胶囊 + 标题栏 ==================== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.island-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 8px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 650;
}
.island-pulse {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--tc), var(--tc-2));
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(0, 122, 255, 0.45);
}
.refresh-orb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 18px;
  color: var(--tc);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.refresh-orb:active { transform: scale(0.86) rotate(180deg); }

/* ==================== Spatial Bento 空间小组件区 ==================== */
.bento-hero {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.hero-glass {
  border-radius: 32px;
  padding: 26px 24px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hero-glass::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  right: -60px;
  top: -60px;
  background: radial-gradient(circle, rgba(0, 122, 255, 0.22), transparent 70%);
  pointer-events: none;
}
.hero-title {
  margin: 0;
  font-size: clamp(26px, 5vw, 38px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.1;
  background: linear-gradient(135deg, var(--ink) 30%, var(--tc) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-sub {
  margin: 8px 0 0;
  font-size: 14px;
  color: var(--mut);
  font-weight: 500;
}

/* 总体进度液态能量条 */
.master-progress {
  margin-top: 20px;
  padding: 12px 14px;
  border-radius: 20px;
  background: var(--glass-pill);
  border: 0.5px solid var(--glass-edge);
}
.mp-head {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  font-weight: 650;
  margin-bottom: 6px;
}
.mp-head span:last-child { color: var(--tc); font-variant-numeric: tabular-nums; }
.mp-track {
  height: 8px;
  border-radius: 99px;
  background: rgba(120, 120, 128, 0.16);
  overflow: hidden;
}
.mp-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--tc), #a855f7, var(--ok));
  box-shadow: 0 0 12px rgba(0, 122, 255, 0.5);
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 2x2 Spatial Widgets 胶囊矩阵 */
.widget-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.widget {
  border-radius: 26px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.widget:active { transform: scale(0.96); }
.w-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}
.w-num {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin-top: 10px;
}
.w-label {
  font-size: 12px;
  color: var(--mut);
  font-weight: 600;
  margin-top: 2px;
}

/* ==================== 科目折射胶囊流 ==================== */
.subject-scroller {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 2px 14px;
  margin: 0 -2px;
}
.subject-scroller::-webkit-scrollbar { display: none; }
.sub-chip {
  flex: none;
  height: 36px;
  padding: 0 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--mut);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.sub-chip:active { transform: scale(0.93); }
.sub-chip.active {
  background: linear-gradient(135deg, var(--tc), var(--tc-2));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 18px -3px rgba(0, 122, 255, 0.45);
}

.section-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 6px 12px;
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
}
.section-bar strong { color: var(--ink); font-weight: 750; }

/* ==================== 题库空间玻璃卡片网格 ==================== */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.card {
  border-radius: 30px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s;
}
@media (hover: hover) {
  .card:hover {
    transform: translateY(-4px) scale(1.01);
  }
}

/* 卡片右上角环境色散光晕 */
.card::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  top: -55px;
  right: -55px;
  border-radius: 50%;
  background: var(--accent, var(--tc));
  opacity: 0.16;
  filter: blur(28px);
  pointer-events: none;
}
.card[data-tone="0"] { --accent: #007aff; --accent-2: #5ac8fa; }
.card[data-tone="1"] { --accent: #5856d6; --accent-2: #af52de; }
.card[data-tone="2"] { --accent: #34c759; --accent-2: #30b0c7; }
.card[data-tone="3"] { --accent: #ff9500; --accent-2: #ff2d55; }
.card[data-tone="4"] { --accent: #af52de; --accent-2: #ff2d55; }
.card[data-tone="5"] { --accent: #00c7be; --accent-2: #007aff; }

.card-top {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 12px;
}

/* 3D 晶莹Squircle图标 */
.squircle-badge {
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 800;
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.55), 0 6px 16px -3px color-mix(in srgb, var(--accent) 45%, transparent);
}
.title-wrap {
  flex: 1;
  min-width: 0;
}
.card h2 {
  margin: 0;
  font-size: 17.5px;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-id {
  display: block;
  font-size: 11.5px;
  color: var(--mut);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Apple Fitness 风格圆环进度 */
.ring-box {
  position: relative;
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
}
.ring-svg {
  width: 44px;
  height: 44px;
  transform: rotate(-90deg);
}
.ring-bg {
  fill: none;
  stroke: rgba(120, 120, 128, 0.16);
  stroke-width: 4;
}
.ring-meter {
  fill: none;
  stroke: var(--accent, var(--tc));
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.ring-pct {
  position: absolute;
  font-size: 10.5px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

.desc {
  margin: 0 0 12px;
  font-size: 13.5px;
  color: var(--mut);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 40px;
}

/* 玻璃微胶囊标签群 */
.meta-flow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}
.pill {
  font-size: 11.5px;
  font-weight: 650;
  padding: 3.5px 9px;
  border-radius: 99px;
  background: var(--glass-pill);
  border: 0.5px solid var(--glass-edge);
  color: var(--mut);
}
.pill.highlight {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 25%, transparent);
}
.pill.good {
  background: rgba(52, 199, 89, 0.12);
  color: var(--ok);
}
.pill.warn {
  background: rgba(255, 149, 0, 0.13);
  color: var(--warn);
}

/* 底部果冻感双按钮 */
.card-foot {
  margin-top: auto;
  padding-top: 12px;
  border-top: 0.5px solid var(--glass-edge);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.foot-status {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mut);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}
.foot-status b { color: var(--ink); }

.action-stack {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.open-btn {
  height: 42px;
  border-radius: 16px;
  font-size: 13.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
}
.open-btn:active { transform: scale(0.94); }
.open-btn.primary {
  background: linear-gradient(135deg, var(--accent, var(--tc)), var(--accent-2, var(--tc-2)));
  color: #fff;
  box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.45), 0 6px 16px -4px color-mix(in srgb, var(--accent, var(--tc)) 50%, transparent);
}
.open-btn.secondary {
  background: var(--glass-pill);
  border: 1px solid var(--glass-border);
  color: var(--ink);
  box-shadow: var(--specular);
}

/* ==================== iOS 26/27 底部悬浮液态玻璃控制坞 (Floating Spatial Dock) ==================== */
.spatial-dock-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 50;
  display: flex;
  justify-content: center;
  padding: 0 12px;
  pointer-events: none;
}
.spatial-dock {
  pointer-events: auto;
  width: min(680px, 100%);
  background: var(--glass-bg-heavy);
  -webkit-backdrop-filter: saturate(220%) blur(36px);
  backdrop-filter: saturate(220%) blur(36px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--specular), var(--shadow-float);
  border-radius: 999px;
  padding: 7px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dock-search {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
}
.dock-search-icon {
  position: absolute;
  left: 12px;
  color: var(--mut);
  font-size: 15px;
  pointer-events: none;
}
.dock-input {
  width: 100%;
  height: 38px;
  border-radius: 999px;
  background: rgba(120, 120, 128, 0.12);
  padding: 0 30px 0 34px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  transition: background-color 0.2s, box-shadow 0.2s;
}
.dock-input::placeholder { color: var(--mut); }
.dock-input:focus {
  outline: none;
  background: var(--glass-bg);
  box-shadow: 0 0 0 2.5px var(--tc);
}
.dock-clear {
  position: absolute;
  right: 8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--mut-soft);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.dock-tabs {
  display: inline-flex;
  background: rgba(120, 120, 128, 0.12);
  padding: 3px;
  border-radius: 999px;
  flex: none;
}
.dock-tab {
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--mut);
  white-space: nowrap;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dock-tab:active { transform: scale(0.92); }
.dock-tab.active {
  background: var(--tc);
  color: #fff;
  box-shadow: 0 2px 10px rgba(0, 122, 255, 0.4);
}

/* 状态框与页脚 */
.empty, .error, .loading {
  border-radius: 28px;
  padding: 44px 20px;
  text-align: center;
  color: var(--mut);
  margin-top: 12px;
  font-size: 14.5px;
}
.error {
  text-align: left;
  padding: 20px;
  color: var(--bad);
  border-color: rgba(255, 59, 48, 0.35);
}
code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px;
  background: rgba(120, 120, 128, 0.15);
  padding: 2px 6px;
  border-radius: 6px;
}
.footer {
  text-align: center;
  color: var(--mut);
  font-size: 12px;
  margin-top: 32px;
  opacity: 0.8;
}

/* ==================== 手机端专项适配 (Mobile-First Spatial Adaptations) ==================== */
@media (max-width: 920px) {
  .bento-hero { grid-template-columns: 1fr; }
  .widget-grid { grid-template-columns: repeat(4, 1fr); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 640px) {
  .shell {
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(155px + env(safe-area-inset-bottom));
  }
  .hero-glass {
    padding: 20px 18px;
    border-radius: 26px;
  }
  .widget-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .widget {
    padding: 14px 16px;
    border-radius: 22px;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
  }
  .w-num { font-size: 21px; margin-top: 0; }
  .w-label { margin-top: 0; font-size: 11.5px; }

  .grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .card {
    padding: 18px 16px;
    border-radius: 26px;
  }
  .open-btn {
    height: 44px;
    font-size: 14px;
    border-radius: 15px;
  }

  /* 手机端底部悬浮胶囊变为双层拇指坞，杜绝横向拥挤与 iOS 输入框自动放大 */
  .spatial-dock-wrap {
    bottom: calc(8px + env(safe-area-inset-bottom));
    padding: 0 10px;
  }
  .spatial-dock {
    border-radius: 26px;
    flex-direction: column;
    align-items: stretch;
    padding: 8px;
    gap: 6px;
  }
  .dock-input {
    height: 40px;
    font-size: 16px; /* 严格 16px，防止 iOS Safari 点击搜索框时画面强制放大 */
  }
  .dock-tabs {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .dock-tab {
    text-align: center;
    height: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .orb { animation: none !important; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- iOS 26/27 动态流体极光背景 -->
<div class="ambient-canvas" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="shell">
  <!-- 顶部灵动岛状态与刷新球 -->
  <header class="top-bar">
    <div class="island-badge liquid-glass">
      <span class="island-pulse">奥</span>
      <span>奥利奥の练习场 · iOS Spatial</span>
    </div>
    <button class="refresh-orb liquid-glass" id="btnReloadTop" type="button" aria-label="刷新题库" title="刷新题库">↻</button>
  </header>

  <!-- Spatial Bento 概览矩阵 -->
  <section class="bento-hero">
    <div class="hero-glass liquid-glass">
      <div>
        <h1 class="hero-title" id="pageTitle">选择你的练习场地</h1>
        <p class="hero-sub">支持整套模考与逐题即时反馈，作答进度实时驻留本机。</p>
      </div>
      <div class="master-progress">
        <div class="mp-head">
          <span>全站总进度</span>
          <span id="masterPctText">0%</span>
        </div>
        <div class="mp-track"><div class="mp-fill" id="masterBar"></div></div>
      </div>
    </div>

    <aside class="widget-grid" aria-label="题库统计">
      <div class="widget liquid-glass">
        <div class="w-icon" style="background:linear-gradient(135deg,#007aff,#5ac8fa)">📚</div>
        <div>
          <div class="w-num" id="statSets">-</div>
          <div class="w-label">可用题库</div>
        </div>
      </div>
      <div class="widget liquid-glass">
        <div class="w-icon" style="background:linear-gradient(135deg,#5856d6,#af52de)">✦</div>
        <div>
          <div class="w-num" id="statQuestions">-</div>
          <div class="w-label">题目总数</div>
        </div>
      </div>
      <div class="widget liquid-glass">
        <div class="w-icon" style="background:linear-gradient(135deg,#34c759,#30b0c7)">✓</div>
        <div>
          <div class="w-num" id="statAnswered">-</div>
          <div class="w-label">本机已答</div>
        </div>
      </div>
      <div class="widget liquid-glass">
        <div class="w-icon" style="background:linear-gradient(135deg,#ff9500,#ff2d55)">⌘</div>
        <div>
          <div class="w-num" id="statSubjects">-</div>
          <div class="w-label">科目分类</div>
        </div>
      </div>
    </aside>
  </section>

  <!-- 科目折射胶囊横向滑动栏 -->
  <nav class="subject-scroller" id="subjectBar" aria-label="科目筛选" hidden></nav>

  <!-- 列表头信息 -->
  <div class="section-bar" id="sets">
    <div>共 <strong id="resultCount">0</strong> 套题库</div>
    <div id="sortNote">本学期优先 · 支持双模式刷题</div>
  </div>

  <!-- 题库空间卡片网格 -->
  <div id="listBox" class="grid"></div>
  <div id="messageBox"></div>

  <footer class="footer">
    版权归属 © 奥利奥利奥 · Spatial Liquid Glass UI
  </footer>
</div>

<!-- iOS 26/27 底部悬浮液态玻璃控制坞 (拇指热区) -->
<div class="spatial-dock-wrap">
  <div class="spatial-dock" role="search">
    <div class="dock-search">
      <span class="dock-search-icon">⌕</span>
      <input class="dock-input" id="searchInput" placeholder="搜索科目、题库名称、标签..." autocomplete="off" />
      <button class="dock-clear" id="btnClearSearch" type="button" hidden aria-label="清空搜索">×</button>
    </div>
    <div class="dock-tabs" id="semesterTabs" role="group" aria-label="题库分类">
      <button class="dock-tab active" type="button" data-semester-group="" aria-pressed="true">全部</button>
      <button class="dock-tab" type="button" data-semester-group="current" aria-pressed="false">本学期</button>
      <button class="dock-tab" type="button" data-semester-group="history" aria-pressed="false">历史</button>
    </div>
  </div>
</div>

<script>
const LIST_URL = "./data/list.json";
let allSets = [];
let activeSemesterGroup = "";
let activeSubject = "";

const $ = (id) => document.getElementById(id);
function esc(s){return String(s ?? "").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]));}
function readJSON(key, fallback){try{return JSON.parse(localStorage.getItem(key) || "")}catch{return fallback}}
function itemInitial(item){const s = item.subject || item.title || item.id || "题"; return String(s).trim().slice(0,1).toUpperCase();}
function toneFor(id){
  let h = 0;
  const s = String(id || "");
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 6;
}
function progressFor(item, total){
  const answers = readJSON(`quiz_answers_${item.id}`, {});
  const answered = Object.values(answers).filter(v => Array.isArray(v) ? v.some(x=>String(x||"").trim()) : String(v||"").trim()).length;
  const t = Number(total || item.total || 0);
  const pct = t ? Math.min(100, Math.round(answered * 100 / t)) : 0;
  return {answered,total:t,pct};
}
function countFromData(data){
  const single = data.single?.length || 0;
  const multi = data.multi?.length || 0;
  const judge = data.judge?.length || 0;
  const blank = data.blank?.length || data.fill?.length || 0;
  const matching = data.matching?.length || 0;
  const short = data.short?.length || 0;
  const caseQ = data.case?.length || data.cases?.length || 0;
  const calculation = data.calculation?.length || 0;
  const mixed = data.questions?.length || 0;
  if (mixed) return {single:0,multi:0,judge:0,blank:0,matching:0,short:0,caseQ:0,calculation:0,total:mixed,mixed:true};
  return {single,multi,judge,blank,matching,short,caseQ,calculation,total:single+multi+judge+blank+matching+short+caseQ+calculation,mixed:false};
}
async function hydrate(item){
  try{
    const res = await fetch(item.file, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    return {...item, counts: countFromData(data)};
  }catch{
    return {...item, counts: {single:item.single||0,multi:item.multi||0,judge:item.judge||0,blank:item.blank||0,total:item.total||0}};
  }
}
function semesterGroupFor(item){
  return item.semesterGroup === "current" ? "current" : "history";
}
function filteredItems(){
  const q = $("searchInput").value.trim().toLowerCase();
  return allSets.filter(item => {
    const groupOk = !activeSemesterGroup || semesterGroupFor(item) === activeSemesterGroup;
    const subOk = !activeSubject || item.subject === activeSubject;
    const hay = [item.title,item.desc,item.subject,(item.tags||[]).join(" "),item.id].join(" ").toLowerCase();
    return groupOk && subOk && (!q || hay.includes(q));
  });
}
function updateHeroStats(){
  const totalSets = allSets.length;
  const totalQuestions = allSets.reduce((sum,item)=>sum + Number(item.counts?.total || item.total || 0),0);
  const totalAnswered = allSets.reduce((sum,item)=>sum + progressFor(item, item.counts?.total).answered,0);
  const subjectList = [...new Set(allSets.map(x=>x.subject).filter(Boolean))];
  $("statSets").textContent = totalSets;
  $("statQuestions").textContent = totalQuestions;
  $("statAnswered").textContent = totalAnswered;
  $("statSubjects").textContent = subjectList.length;

  const masterPct = totalQuestions ? Math.min(100, Math.round(totalAnswered * 100 / totalQuestions)) : 0;
  $("masterPctText").textContent = `${totalAnswered} / ${totalQuestions} (${masterPct}%)`;
  $("masterBar").style.width = `${masterPct}%`;

  const subBar = $("subjectBar");
  if (subjectList.length > 0) {
    subBar.hidden = false;
    subBar.innerHTML = [
      `<button class="sub-chip liquid-glass ${activeSubject === "" ? "active" : ""}" type="button" data-subject="">全部科目</button>`,
      ...subjectList.map(s => `<button class="sub-chip liquid-glass ${activeSubject === s ? "active" : ""}" type="button" data-subject="${esc(s)}">${esc(s)}</button>`)
    ].join("");
  } else {
    subBar.hidden = true;
  }
}
function render(){
  const q = $("searchInput").value.trim();
  $("btnClearSearch").hidden = !q;
  const items = filteredItems();
  $("resultCount").textContent = items.length;

  if (!items.length && activeSemesterGroup && !q) {
    $("messageBox").innerHTML = `<div class="empty liquid-glass">${activeSemesterGroup === "current" ? "本学期暂无题库。" : "暂无历史题库。"}</div>`;
  } else {
    $("messageBox").innerHTML = items.length ? "" : `<div class="empty liquid-glass">没有匹配的题库。换个关键词，或者检查 <code>data/list.json</code> 是否已经更新。</div>`;
  }

  const circumference = 2 * Math.PI * 17; // r=17

  $("listBox").innerHTML = items.map(item => {
    const c = item.counts || {};
    const p = progressFor(item, c.total);
    const offset = circumference - (p.pct / 100) * circumference;
    const tags = [item.subject, ...(item.tags||[])].filter(Boolean).slice(0,4);
    const config = [
      item.shuffleOptions !== false ? "选项乱序" : "固定选项",
      item.shuffleQuestions ? "题序乱序" : "固定题序",
      item.durationMinutes ? `${item.durationMinutes}分钟` : "不限时"
    ];
    const typePills = [
      c.single ? `<span class="pill">单选 ${c.single}</span>` : "",
      c.multi ? `<span class="pill">多选 ${c.multi}</span>` : "",
      c.judge ? `<span class="pill">判断 ${c.judge}</span>` : "",
      c.blank ? `<span class="pill">填空 ${c.blank}</span>` : "",
      c.matching ? `<span class="pill warn">匹配 ${c.matching}</span>` : "",
      c.short ? `<span class="pill warn">简答 ${c.short}</span>` : "",
      c.caseQ ? `<span class="pill warn">案例 ${c.caseQ}</span>` : "",
      c.calculation ? `<span class="pill warn">计算 ${c.calculation}</span>` : ""
    ].join("");

    return `<article class="card liquid-glass" data-tone="${toneFor(item.id)}">
      <div class="card-top">
        <div class="squircle-badge">${esc(itemInitial(item))}</div>
        <div class="title-wrap">
          <h2 title="${esc(item.title)}">${esc(item.title)}</h2>
          <span class="card-id" title="${esc(item.id)}">${esc(item.id)}</span>
        </div>
        <div class="ring-box" title="已答 ${p.answered}/${p.total || "?"}">
          <svg class="ring-svg" viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="17"></circle>
            <circle class="ring-meter" cx="22" cy="22" r="17" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
          </svg>
          <span class="ring-pct">${p.pct}%</span>
        </div>
      </div>

      <p class="desc">${esc(item.desc || "暂无描述")}</p>

      <div class="meta-flow">
        <span class="pill highlight">共 ${c.total || item.total || "?"} 题</span>
        ${typePills}
        ${tags.map(t=>`<span class="pill good">${esc(t)}</span>`).join("")}
        ${config.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
      </div>

      <div class="card-foot">
        <div class="foot-status">
          <span>作答进度</span>
          <span>已答 <b>${p.answered}</b> / ${p.total || "?"}</span>
        </div>
        <div class="action-stack">
          <a class="open-btn primary" href="/q/${encodeURIComponent(item.id)}">整套刷题</a>
          <a class="open-btn secondary" href="/p/${encodeURIComponent(item.id)}">逐题练习</a>
        </div>
      </div>
    </article>`;
  }).join("");
}
async function load(){
  $("messageBox").innerHTML = `<div class="loading liquid-glass">正在读取题库列表...</div>`;
  try{
    const res = await fetch(LIST_URL, {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const list = await res.json();
    if(!Array.isArray(list)) throw new Error("list.json 必须是数组");
    allSets = await Promise.all(list.filter(x=>x && x.enabled !== false).map(hydrate));
    allSets.sort((a,b) => Number(semesterGroupFor(b) === "current") - Number(semesterGroupFor(a) === "current"));
    $("messageBox").innerHTML = "";
    updateHeroStats();
    render();
  }catch(err){
    $("listBox").innerHTML = "";
    $("resultCount").textContent = "0";
    $("statSets").textContent = "0";
    $("statQuestions").textContent = "0";
    $("statAnswered").textContent = "0";
    $("statSubjects").textContent = "0";
    $("messageBox").innerHTML = `<div class="error liquid-glass"><b>题库列表加载失败。</b><br/>请确认 <code>data/list.json</code> 存在。若刚放入新题库，请先运行 <code>python scripts/reflash.py</code>。并且你需要通过本地服务器或网站访问，而不是直接双击打开 HTML。<br/>错误信息：${esc(err.message)}</div>`;
  }
}

$("semesterTabs").querySelectorAll(".dock-tab").forEach(btn => btn.addEventListener("click", () => {
  activeSemesterGroup = btn.dataset.semesterGroup;
  $("semesterTabs").querySelectorAll(".dock-tab").forEach(tab => {
    const active = tab === btn;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-pressed", active);
  });
  render();
}));

$("subjectBar").addEventListener("click", e => {
  const btn = e.target.closest("[data-subject]");
  if (!btn) return;
  activeSubject = btn.dataset.subject;
  $("subjectBar").querySelectorAll(".sub-chip").forEach(chip => {
    chip.classList.toggle("active", chip === btn);
  });
  render();
});

$("searchInput").addEventListener("input", render);
$("btnClearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  render();
});
$("btnReloadTop").addEventListener("click", load);
load();
</script>
</body>
</html>
