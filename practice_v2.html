/* Fade ends at the type pills; one eased surface has no lower seam. */
:root{--touch-header-rgb:255,255,255;--header-solid:calc(60px + env(safe-area-inset-top))}
@media(prefers-color-scheme:dark){:root{--touch-header-rgb:28,28,30}}
.top::before{
  content:"";display:none;position:absolute;inset:0 0 10px;
  z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(var(--touch-header-rgb),1) 0,
    rgba(var(--touch-header-rgb),1) var(--header-solid),
    rgba(var(--touch-header-rgb),.896) calc(var(--header-solid) + (100% - var(--header-solid)) * .2),
    rgba(var(--touch-header-rgb),.648) calc(var(--header-solid) + (100% - var(--header-solid)) * .4),
    rgba(var(--touch-header-rgb),.352) calc(var(--header-solid) + (100% - var(--header-solid)) * .6),
    rgba(var(--touch-header-rgb),.104) calc(var(--header-solid) + (100% - var(--header-solid)) * .8),
    rgba(var(--touch-header-rgb),0) 100%);
}
@media (max-width:640px), (hover:none) and (pointer:coarse){
  .top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0}
  .top::before{display:block}
  .top::after{content:none;display:none}
}
html.ipad-parity .top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0}
html.ipad-parity .top::before{display:block}
html.ipad-parity .top::after{content:none;display:none}
/* Match the page at rest; the longer in-header fade appears over scrolled cards. */
html.ipad-parity{--touch-header-rgb:242,242,247;--header-solid:calc(44px + env(safe-area-inset-top))}
@media(prefers-color-scheme:dark){html.ipad-parity{--touch-header-rgb:0,0,0}}

/* Native-size text inside two opposing clipping windows. Only a handful of
   cards intersecting the old/new viewport receive compositor animations. */
.question.phone-reveal-prepared{content-visibility:visible}
.question.phone-reveal-ready{
  position:relative;isolation:isolate;contain:layout style;
  background:transparent;border-color:transparent;
  box-shadow:none;transition:none;
}
.phone-reveal-ready .card-surface{
  position:absolute;z-index:-1;pointer-events:none;
  border:.5px solid var(--line);
  border-radius:inherit;background:var(--card);box-shadow:var(--shadow-card);transform-origin:top;
}
.phone-reveal-ready .reveal{
  display:block;height:0;overflow:hidden;opacity:1;transition:none;grid-template-rows:none;
}
.phone-reveal-ready .reveal.open{height:auto}
.phone-reveal-ready .reveal-inner{height:auto;overflow:hidden}
@media(prefers-reduced-motion:reduce){.reveal{transition:none!important}}

/* Shared touch reveals own their reading anchor, including full-width iPad views. */
html.reading-anchor-active,html.reading-anchor-active body{overflow-anchor:none}
@media(max-width:640px){
 .question.buffer-animating{content-visibility:visible}
 html.phone-anim-contain .question.buffer-animating{contain:content}
}
@media(max-width:640px) and (any-pointer:coarse){
 html.phone-anim-contain .reveal.animate{transition-duration:260ms}
}
/* Avoid root programmatic scroll glitches on older iPhone WebKit. */
html.ios-inner-scroll,html.ios-inner-scroll body{height:100%;overflow:hidden}
html.ios-inner-scroll #quizScroll{
  height:100%;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scroll-padding-top:175px;overflow-anchor:none;
}
@media(max-width:640px){html.ios-inner-scroll #quizScroll{scroll-padding-top:195px}}

/* 逐题练习 V2：沿用整套 V5 的主题、导航和题目组件。 */
main.shell{max-width:980px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.top-row .title{text-align:center}
.top-stats{flex:none;white-space:nowrap;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.top-stats b{color:var(--ink)}
.top .toolbar{min-height:36px}
.practice-toolbar-note{flex:none;font-size:12px;color:var(--mut)}
.practice-summary{justify-content:space-between;gap:6px 14px}
.practice-summary span:last-child{text-align:right}
.panel{background:transparent;min-width:0}
.panel .question{margin:0}
.question-head{align-items:center}
.q-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;color:var(--mut);background:rgba(120,120,128,.08);line-height:1.4}
.tag.ok{color:var(--ok);background:var(--okbg)}
.tag.bad{color:var(--bad);background:var(--badbg)}
.tag.warn{color:var(--mut);background:rgba(120,120,128,.08)}
.tag.info{color:var(--tc);background:var(--selected)}
.question .stem{margin-top:4px}
.actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px}
.left-actions,.right-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actions .tool{height:36px;padding:0 16px}
.tool.good{color:#fff;background:var(--ok)}
.tool.good:hover{background:var(--ok)}
.actions .tool:disabled,.bottom .tool:disabled{opacity:.38;cursor:default;transform:none}
.answer-line{display:grid;grid-template-rows:0fr;opacity:0;overflow:hidden;margin-top:0;transition:grid-template-rows .3s cubic-bezier(.25,1,.5,1),opacity .25s ease-out,margin-top .3s}
.answer-line.open{grid-template-rows:1fr;opacity:1;margin-top:14px}
.answer-inner{min-height:0;overflow:hidden}
.answer-line .result{margin-top:0}
.answer-line .result-explanation{white-space:pre-wrap;overflow-wrap:anywhere}
.answer-line .result-value{white-space:pre-wrap;overflow-wrap:anywhere}
.bottom{position:fixed;z-index:25;bottom:0;left:0;right:0;background:var(--header);border-top:.5px solid var(--header-border);-webkit-backdrop-filter:saturate(150%) blur(14px);backdrop-filter:saturate(150%) blur(14px)}
.bottom-inner{max-width:980px;margin:auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px}
.bottom-status{font-size:12px;color:var(--mut);line-height:1.5}
.bottom-status b{font-weight:600;color:var(--ink)}
.bottom .right-actions{margin-left:auto}
.bottom .tool{min-width:92px;height:40px}
.practice-link{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:.5px solid var(--line);border-radius:12px;background:var(--option);color:var(--tc);padding:8px 16px;font-size:14px;font-weight:600}
.practice-link:hover{background:var(--selected)}
#progressBar{transition:width .3s cubic-bezier(.25,1,.5,1)}
#btnResetPractice{color:var(--bad);background:var(--badbg);border-color:var(--bad-border)}
@media(max-width:640px){
 main.shell{padding:12px 10px calc(100px + env(safe-area-inset-bottom))}
 .top .toolbar{flex-wrap:wrap;gap:6px}
 .top .filters{flex-basis:100%;order:2}
 .top-stats{font-size:12px}
 .practice-toolbar-note{font-size:11px}
 .practice-summary{font-size:12px}
 .question{padding:16px}
 .q-meta{justify-content:flex-end}
 .actions{align-items:stretch;gap:8px}
 .left-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .left-actions .tool{padding:0 8px}
 .right-actions{margin-left:auto}
 .actions .right-actions .tool{height:32px;padding-inline:12px;font-size:12px}
 .bottom-inner{padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
 .bottom-status{display:none}
 .bottom .right-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .bottom .tool{min-width:0;height:42px}
}
@media(prefers-reduced-motion:reduce){.answer-line,#progressBar{transition:none!important}}

</style>
</head>
<body>
<div id="practiceScroll">
<header class="top">
 <div class="top-inner">
  <div class="top-row">
   <a class="icon" href="/" aria-label="返回主页">‹</a>
   <div class="title" id="title">逐题练习</div>
   <div class="top-stats" id="topStats">0 / 0 已答</div>
   <button class="icon" id="settings" type="button" aria-label="设置">⋯</button>
  </div>
  <div class="bar" id="progress" role="progressbar" aria-label="当前题号进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressBar"></span></div>
  <div class="toolbar">
   <div class="filters" id="typeBar" aria-label="题型筛选">
    <button class="pill active" type="button" data-type-filter="all">全部</button>
    <button class="pill" type="button" data-type-filter="single">单选</button>
    <button class="pill" type="button" data-type-filter="multi">多选</button>
    <button class="pill" type="button" data-type-filter="judge">判断</button>
    <button class="pill" type="button" data-type-filter="blank">填空</button>
    <button class="pill" type="button" data-type-filter="short">简答</button>
   </div>
   <span class="practice-toolbar-note">逐题练习</span>
  </div>
 </div>
</header>
<main class="shell">
 <div class="summary practice-summary">
  <span id="progressText">正在加载题库...</span>
  <span id="resultText">做完一道看一道答案</span>
 </div>
 <section class="panel" id="practicePanel" aria-label="逐题练习">
  <div id="app"><div class="empty">正在加载题库...</div></div>
 </section>
 <div class="summary" style="margin-top:14px"><span id="subtitle"></span></div>
</main>
<nav class="bottom" aria-label="翻题导航">
 <div class="bottom-inner">
  <div class="bottom-status" id="statusBar">逐题模式：做完一道看一道答案</div>
  <div class="right-actions">
   <button class="tool" id="btnPrev" type="button">上一题</button>
   <button class="tool primary" id="btnNext" type="button">下一题</button>
  </div>
 </div>
</nav>
<dialog id="dialog" aria-labelledby="dialogTitle">
 <div class="dialog-head"><span id="dialogTitle">设置</span><button class="icon" id="closeDialog" type="button" aria-label="关闭">×</button></div>
 <div class="dialog-body">
  <h3>答题模式</h3>
  <div class="dialog-actions">
   <a class="practice-link" id="normalLink" href="/quiz.html">切换整套刷题</a>
   <a class="practice-link" id="oldLink" href="/practice.html">返回旧版逐题</a>
  </div>
  <h3>逐题进度</h3>
  <div class="dialog-actions"><button id="btnResetPractice" type="button">重置逐题进度</button></div>
  <p class="note">只清除已看答案记录与当前题号，不删除作答内容。作答与整套刷题共用保存记录。</p>
 </div>
</dialog>
<script>

const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LIST_URL = "./data/list.json";
let setId = "";
let setInfo = null;
let rawData = null;
let questions = [];
let ordered = [];
let answers = {};
let feedback = {};
let currentIndex = 0;
let typeFilter = "all";
let seed = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]));
function renderMath(){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear && MathJax.typesetClear();
    MathJax.typesetPromise([$('app')]).catch(err => console.warn('MathJax typeset failed:', err));
  }
}
function answerKey(){return `quiz_answers_${setId}`}
function seedKey(){return `quiz_seed_${setId}`}
function practiceStateKey(){return `practice_state_${setId}`}
function feedbackKey(){return `practice_feedback_${setId}`}
function readJSON(key, fallback){try{return JSON.parse(localStorage.getItem(key) || "")}catch{return fallback}}
function saveAnswers(){localStorage.setItem(answerKey(), JSON.stringify(answers)); updateStats();}
function saveFeedback(){localStorage.setItem(feedbackKey(), JSON.stringify(feedback));}
function saveState(){localStorage.setItem(practiceStateKey(), JSON.stringify({currentIndex,typeFilter}));}
function normalizeText(s){return String(s ?? "").trim().replace(/\s+/g," ").toLowerCase();}
function normalizeChoiceAnswer(ans){return String(ans ?? "").toUpperCase().replace(/[^A-Z]/g,"").split("");}
function sameSet(a,b){const aa=[...new Set(a)].sort().join("");const bb=[...new Set(b)].sort().join("");return aa===bb;}
function hashString(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0;}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function shuffleDet(arr, key){const out=[...arr];const rnd=mulberry32(hashString(`${seed}|${key}`));for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out;}
function qKey(type, num, idx){return `${type}:${num ?? idx+1}`;}
function qLabel(type){return {single:"单选",multi:"多选",judge:"判断",blank:"填空",short:"简答"}[type] || type;}
function normalizeOptions(options){
  if(!options) return options;
  if(Array.isArray(options)){
    const obj = {};
    options.forEach((x,i)=>{obj[LETTERS[i]] = x});
    return obj;
  }
  return options;
}
function normalizeQuestion(q, type, idx){
  const num = q.num ?? q.id ?? idx + 1;
  let options = normalizeOptions(q.options);
  if(type === "judge" && !options) options = {A:"对",B:"错"};
  return {...q, type, num, key:qKey(type,num,idx), options};
}
function normalizeData(data){
  if(Array.isArray(data.questions)) return data.questions.map((q,idx)=>normalizeQuestion(q, q.type || "single", idx));
  const list=[];
  (data.single||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"single",i)));
  (data.multi||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"multi",i)));
  (data.judge||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"judge",i)));
  (data.blank||data.fill||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"blank",i)));
  (data.short||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"short",i)));
  return list;
}
function buildOrder(){
  let list = [...questions];
  if(setInfo?.shuffleQuestions) list = shuffleDet(list, "question-order");
  if(typeFilter !== "all") list = list.filter(q=>q.type === typeFilter);
  ordered = list;
  if(currentIndex >= ordered.length) currentIndex = Math.max(0, ordered.length - 1);
}
function imageList(q){
  const list = [];
  if(q.image) list.push({src:q.image, caption:q.imageCaption || q.caption || ""});
  if(Array.isArray(q.images)) q.images.forEach(item=>{if(typeof item === "string") list.push({src:item, caption:""}); else if(item && item.src) list.push({src:item.src, caption:item.caption || item.title || ""});});
  return list;
}
function mediaListFrom(q, singleKeys, multiKeys){
  const list = [];
  singleKeys.forEach(key=>{ if(q[key]) list.push({src:q[key], caption:q[`${key}Caption`] || ""}); });
  multiKeys.forEach(key=>{ if(Array.isArray(q[key])) q[key].forEach(item=>{if(typeof item === "string") list.push({src:item, caption:""}); else if(item && item.src) list.push({src:item.src, caption:item.caption || item.title || ""});}); });
  return list;
}
function renderImageBlock(imgs, className, altText){return `<div class="${className}">${imgs.map(img=>`<figure><img src="${esc(img.src)}" alt="${esc(img.caption || altText || "图片")}" loading="lazy"/>${img.caption ? `<figcaption>${esc(img.caption)}</figcaption>` : ""}</figure>`).join("")}</div>`;}
function renderQuestionImages(q){const imgs=imageList(q); return imgs.length ? renderImageBlock(imgs,"q-images",q.stem || "题目图片") : "";}
function renderAnswerImages(q){const imgs=mediaListFrom(q,["answerImage","solutionImage","explanationImage"],["answerImages","solutionImages","explanationImages"]); return imgs.length ? renderImageBlock(imgs,"answer-images","答案图片") : "";}
function getOptions(q){
  const entries = Object.entries(q.options || {});
  const shouldShuffle = setInfo?.shuffleOptions !== false && !(q.type === "judge" && setInfo?.shuffleJudge !== true);
  const ordered = shouldShuffle ? shuffleDet(entries, q.key) : entries;
  return ordered.map(([origKey,text], idx)=>({origKey:String(origKey).toUpperCase(), text, display:LETTERS[idx]}));
}
function blankExpected(q){const src = q.answers ?? q.answer ?? []; if(Array.isArray(src)) return src.map(x=>Array.isArray(x)?x.map(String):[String(x)]); return [[String(src)]];}
function formatBlankAnswer(q){return blankExpected(q).map(x=>x.join(" / ")).join("；");}
function isAnswered(q){const val=answers[q.key]; if(q.type==="multi") return Array.isArray(val)&&val.length>0; if(q.type==="blank") return Array.isArray(val)&&val.some(x=>String(x||"").trim()); if(q.type==="short") return String(val||"").trim()!==""; return String(val||"").trim()!=="";}
function isCorrect(q){
  if(q.type==="short") return false;
  if(!isAnswered(q)) return false;
  if(q.type==="multi") return sameSet(answers[q.key] || [], normalizeChoiceAnswer(q.answer));
  if(q.type==="blank"){
    const got = Array.isArray(answers[q.key]) ? answers[q.key] : [answers[q.key]];
    const expected = blankExpected(q);
    if(got.length < expected.length) return false;
    return expected.every((accepts,i)=>accepts.map(normalizeText).includes(normalizeText(got[i])));
  }
  return sameSet([answers[q.key]], normalizeChoiceAnswer(q.answer));
}
function correctDisplay(q, opts){if(q.type==="short") return String(q.answer ?? q.reference ?? ""); if(q.type==="blank") return formatBlankAnswer(q); const ans=normalizeChoiceAnswer(q.answer); return opts.filter(o=>ans.includes(o.origKey)).map(o=>o.display).join("");}
function userDisplay(q, opts){const val=answers[q.key]; if(q.type==="short") return String(val||""); if(q.type==="blank") return Array.isArray(val)?val.join(" / "):(val||""); const arr=Array.isArray(val)?val:normalizeChoiceAnswer(val); return opts.filter(o=>arr.includes(o.origKey)).map(o=>o.display).join("");}
function feedbackShown(q){return !!feedback[q.key];}
function markFeedback(q){feedback[q.key]=true; saveFeedback();}
function renderStemWithBlanks(q){
  const expected=blankExpected(q);let used=0;
  const stem=esc(q.stem || "").replace(/\{\{blank\}\}|_{3,}/g,()=>blankInput(q,used++));
  if(used<expected.length){
    const more=expected.slice(used).map((_,i)=>blankInput(q,used+i)).join(" ");
    return stem + '<div style="margin-top:10px">'+more+'</div>';
  }
  return stem;
}
function blankInput(q,i){
  const vals=Array.isArray(answers[q.key])?answers[q.key]:[]; let cls="blank-input";
  if(feedbackShown(q) && isAnswered(q)){const ok=(blankExpected(q)[i]||[]).map(normalizeText).includes(normalizeText(vals[i])); cls += ok ? " correct" : " wrong";}
  return `<input class="${cls}" data-qkey="${esc(q.key)}" data-blank-index="${i}" value="${esc(vals[i] || "")}" placeholder="填空 ${i+1}" />`;
}
function answerLine(q, opts=[]){
  const show=feedbackShown(q);
  const label=q.type==="short"||q.type==="blank"?"参考答案":"正确答案";
  const answer=q.type==="short" ? String(q.answer ?? q.reference ?? "暂无") : correctDisplay(q,opts);
  const mine=userDisplay(q,opts)||"未答";
  const verdict=show&&q.type!=="short"&&isAnswered(q)?(isCorrect(q)?" good":" bad"):"";
  const mineRow=q.type==="short"?"":'<div class="result-row"><span class="result-label">你的答案</span><span class="result-value">'+esc(mine)+'</span></div>';
  const explanation=q.explanation?'<div class="result-explanation"><span class="result-label">解析</span>'+esc(q.explanation)+'</div>':"";
  return '<div class="answer-line '+(show?"open":"")+'" aria-hidden="'+(!show)+'"><div class="answer-inner"><div class="result'+verdict+'"><div class="result-row"><span class="result-label">'+label+'</span><span class="result-value">'+esc(answer||"暂无")+'</span></div>'+mineRow+explanation+renderAnswerImages(q)+'</div></div></div>';
}
function renderChoice(q){
 const opts=getOptions(q);
 const selected=Array.isArray(answers[q.key])?answers[q.key]:normalizeChoiceAnswer(answers[q.key]);
 const correctOrig=normalizeChoiceAnswer(q.answer);
 const show=feedbackShown(q);
 return '<div class="options">'+opts.map(o=>{
  const checked=selected.includes(o.origKey)?"checked":"";
  const type=q.type==="multi"?"checkbox":"radio";
  let cls="opt";
  if(show&&correctOrig.includes(o.origKey))cls+=" correct";
  if(show&&selected.includes(o.origKey)&&!correctOrig.includes(o.origKey))cls+=" wrong";
  return '<label class="'+cls+'"><input type="'+type+'" name="'+esc(q.key)+'" data-qkey="'+esc(q.key)+'" value="'+esc(o.origKey)+'" '+checked+'/>'+
  '<span class="letter">'+o.display+'</span><span class="text">'+esc(o.text)+'</span><span class="feedback-icon" aria-hidden="true"></span></label>';
 }).join('')+'</div>'+answerLine(q,opts);
}
function renderBlank(q){return `<div class="stem ${q.code ? "code" : ""}">${renderStemWithBlanks(q)}</div>${renderQuestionImages(q)}${answerLine(q,[])}`;}
function renderShort(q){
 const val=String(answers[q.key]||"");
 return '<div class="stem '+(q.code?"code":"")+'">'+esc(q.stem||"")+'</div>'+renderQuestionImages(q)+
 '<textarea class="short-answer" data-qkey="'+esc(q.key)+'" placeholder="在这里写你的答案，系统会自动保存。">'+esc(val)+'</textarea>'+
 '<div class="self-note">简答 / 案例 / 计算题按自评处理，查看参考答案后自行核对。</div>'+answerLine(q,[]);
}
function currentQ(){return ordered[currentIndex];}
function render(animateReveal=false){
 buildOrder();
 const q=currentQ();
 document.querySelectorAll('[data-type-filter]').forEach(btn=>{
   const active=btn.dataset.typeFilter===typeFilter;
   btn.classList.toggle('active',active);
   btn.setAttribute('aria-pressed',String(active));
 });
 if(!q){
   $('app').innerHTML='<div class="empty">当前题型没有题目。</div>';
   updateProgress();updateStats();return;
 }
 const shown=feedbackShown(q);
 const status=q.type==="short"?(isAnswered(q)?'<span class="tag info">已写</span>':'<span class="tag warn">未写</span>'):
  (!shown?'<span class="tag warn">未查看答案</span>':
  (!isAnswered(q)?'<span class="tag warn">未答</span>':
   (isCorrect(q)?'<span class="tag ok">正确</span>':'<span class="tag bad">错误</span>')));
 const body=q.type==="blank"?renderBlank(q):(q.type==="short"?renderShort(q):
  '<div class="stem '+(q.code?"code":"")+'">'+esc(q.stem||"")+'</div>'+renderQuestionImages(q)+renderChoice(q));
 const label=q.type==="short"?"查看参考答案":"确认答案";
 const confirmClass=q.type==="short"?"good":"primary";
 $('app').innerHTML='<article class="question q" data-type="'+esc(q.type)+'" data-qkey="'+esc(q.key)+'">'+
  '<div class="question-head"><span class="type-badge">'+qLabel(q.type)+' '+(currentIndex+1)+'</span>'+
  '<div class="q-meta"><span class="tag">原题 '+esc(q.num)+'</span>'+status+'</div></div>'+body+'</article>'+
  '<div class="actions"><div class="left-actions"><button class="tool '+confirmClass+'" id="btnCheck" type="button">'+label+'</button>'+
  '<button class="tool" id="btnReveal" type="button">只看答案</button></div>'+
  '<div class="right-actions"><button class="tool" id="btnFirst" type="button">第一题</button>'+
  '<button class="tool" id="btnLast" type="button">最后一题</button></div></div>';
 $('btnCheck').addEventListener('click',()=>{const before=feedbackShown(q);markFeedback(q);render(!before);});
 $('btnReveal').addEventListener('click',()=>{const before=feedbackShown(q);markFeedback(q);render(!before);});
 $('btnFirst').addEventListener('click',()=>{currentIndex=0;saveState();render();});
 $('btnLast').addEventListener('click',()=>{currentIndex=Math.max(0,ordered.length-1);saveState();render();});
 $('btnFirst').disabled=currentIndex===0;
 $('btnLast').disabled=currentIndex===ordered.length-1;
 updateProgress();updateStats();renderMath();
 if(animateReveal){
   const panel=$('app').querySelector('.answer-line.open');
   if(panel && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
     panel.classList.remove('open');
     void panel.offsetHeight;
     requestAnimationFrame(()=>{if(panel.isConnected)panel.classList.add('open');});
   }
 }
}
function updateProgress(){
 const total=ordered.length;
 const q=currentQ();
 const p=total?Math.round((currentIndex+1)*100/total):0;
 $('progressText').textContent=total?'第 '+(currentIndex+1)+' / '+total+' 题':'无题目';
 $('progressBar').style.width=p+'%';
 $('progress').setAttribute('aria-valuenow',String(p));
 $('btnPrev').disabled=!total||currentIndex<=0;
 $('btnNext').disabled=!total||currentIndex>=total-1;
 if(!q){$('resultText').textContent='';return;}
 $('resultText').textContent=feedbackShown(q)?
  (q.type==='short'?'已显示参考答案':(!isAnswered(q)?'已显示答案 · 未答':isCorrect(q)?'本题正确':'本题错误')):
  '作答后查看答案';
}
function updateStats(){
 const scope=questions.filter(q=>typeFilter==='all'||q.type===typeFilter);
 const total=scope.length;
 const answered=scope.filter(isAnswered).length;
 const done=scope.filter(q=>feedbackShown(q)).length;
 $('topStats').innerHTML='<b>'+answered+'</b> / '+total+' 已答';
 $('statusBar').innerHTML='已答 <b>'+answered+'</b> / '+total+' · 已看答案 <b>'+done+'</b> / '+total;
}
function onChoiceChange(input){
 const q=questions.find(x=>x.key===input.dataset.qkey);if(!q)return;
 const card=input.closest('.q');
 if(q.type==='multi')answers[q.key]=[...card.querySelectorAll('input:checked')].map(x=>x.value);
 else{answers[q.key]=input.value;markFeedback(q);}
 saveAnswers();render(q.type!=='multi');
}
function onBlankInput(input){
  const q=questions.find(x=>x.key===input.dataset.qkey); if(!q) return;
  const expected=blankExpected(q); const vals=Array.isArray(answers[q.key])?[...answers[q.key]]:Array(expected.length).fill('');
  vals[Number(input.dataset.blankIndex)] = input.value; answers[q.key]=vals; saveAnswers();
}
function onShortInput(input){const q=questions.find(x=>x.key===input.dataset.qkey); if(!q) return; answers[q.key]=input.value; saveAnswers();}
function nextQuestion(delta){if(!ordered.length) return; currentIndex=Math.min(Math.max(currentIndex+delta,0),ordered.length-1); saveState(); render();}
function getSetIdFromUrl(){
  const params=new URLSearchParams(location.search); const fromQuery=params.get('set'); if(fromQuery) return fromQuery;
  let match=location.pathname.match(/^\/p\/([^/]+)\/?$/); if(match) return decodeURIComponent(match[1]);
  match=location.pathname.match(/^\/q\/([^/]+)\/?$/); if(match) return decodeURIComponent(match[1]);
  return '';
}
async function loadPractice(){
  setId=getSetIdFromUrl();
  if(!setId){$('app').innerHTML=`<div class="error"><b>缺少题库参数。</b><br/>请从 <a href="/">主页</a> 选择题库，或使用 <code>/p/题库ID</code> 打开。</div>`;return;}
  try{
    const listRes=await fetch(LIST_URL,{cache:'no-store'}); if(!listRes.ok) throw new Error(`list.json HTTP ${listRes.status}`);
    const list=await listRes.json(); setInfo=list.find(x=>x.id===setId); if(!setInfo) throw new Error(`list.json 中没有找到题库 ID：${setId}`);
    const dataRes=await fetch(setInfo.file,{cache:'no-store'}); if(!dataRes.ok) throw new Error(`${setInfo.file} HTTP ${dataRes.status}`);
    rawData=await dataRes.json(); questions=normalizeData(rawData); answers=readJSON(answerKey(),{}); feedback=readJSON(feedbackKey(),{});
    const st=readJSON(practiceStateKey(),{}); currentIndex=Number(st.currentIndex||0); typeFilter=st.typeFilter || 'all';
    seed=localStorage.getItem(seedKey()); if(!seed){seed=`${Date.now()}-${Math.random()}`;localStorage.setItem(seedKey(),seed);}
    $('title').textContent = rawData.meta?.title || setInfo.title || '逐题练习';
    $('subtitle').textContent = setInfo.desc || '逐题练习 · 做完一道看一道答案';
    document.title = $('title').textContent + ' · 逐题练习 V2';
    $('oldLink').href = `/practice.html?set=${encodeURIComponent(setId)}`;
    $('normalLink').href = `/q/${encodeURIComponent(setId)}`;
    render();
  }catch(err){$('app').innerHTML=`<div class="error"><b>题库加载失败。</b><br/>${esc(err.message)}<br/><br/>检查：1）伪静态是否设置；2）data/list.json 的 id 和 file 是否正确；3）题库 JSON 是否合法。</div>`;}
}
document.addEventListener('change',e=>{if(e.target.matches('input[type="radio"],input[type="checkbox"]')) onChoiceChange(e.target);});
document.addEventListener('input',e=>{if(e.target.matches('.blank-input')) onBlankInput(e.target); if(e.target.matches('.short-answer')) onShortInput(e.target);});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-type-filter]'); if(!btn) return; typeFilter=btn.dataset.typeFilter || 'all'; currentIndex=0; saveState(); render();});
$('btnPrev').addEventListener('click',()=>nextQuestion(-1));
$('btnNext').addEventListener('click',()=>nextQuestion(1));
$('btnResetPractice').addEventListener('click',()=>{if(confirm('确定清空逐题练习的答案显示进度？作答内容不会删除。')){feedback={};currentIndex=0;saveFeedback();saveState();render();$('dialog').close();}});
window.addEventListener('keydown',e=>{if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return; if(e.key==='ArrowRight') nextQuestion(1); if(e.key==='ArrowLeft') nextQuestion(-1);});
$('settings').addEventListener('click',()=> $('dialog').showModal());
$('closeDialog').addEventListener('click',()=> $('dialog').close());
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close();});
const isIPad=/iPad/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isPhoneDevice=/iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent);
document.documentElement.classList.toggle('ipad-parity',isIPad||!isPhoneDevice);
loadPractice();

</script>
