<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<base href="/">
<title>答题页</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
<script>
window.MathJax = {
  tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true},
  options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root {
  color-scheme: light dark;
  --tc:#3b5bdb; --bg:#f2f3f6; --card:#fff; --ink:#151a24; --mut:#667085;
  --rule:#e7eaf0; --ok:#12a150; --bad:#e5383b; --warn:#d9822b; --okbg:#e6f7ee; --badbg:#fdecec;
  --header:rgba(242,243,246,.9); --shadow:0 8px 24px rgba(20,30,50,.045);
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg:#0b0e13; --card:#151a21; --ink:#eef1f6; --mut:#98a2b3; --rule:#262d38;
    --tc:#8ba0ff; --ok:#4ade80; --bad:#ff7b7b; --warn:#fbbf24;
    --okbg:#10291d; --badbg:#351519; --header:rgba(11,14,19,.9); --shadow:0 8px 24px rgba(0,0,0,.13);
  }
}
* {box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html {scroll-behavior:smooth; scroll-padding-top:180px}
body {margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; line-height:1.6}
button,input,textarea {font:inherit; color:inherit}
button {cursor:pointer}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {outline:3px solid var(--tc); outline-offset:2px}
a {color:inherit; text-decoration:none}
.top {position:sticky; top:0; z-index:10; background:var(--header); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--rule)}
.top-inner {max-width:1080px; margin:auto; padding:calc(6px + env(safe-area-inset-top)) 20px 8px}
.top-row {display:flex; align-items:center; gap:10px; min-width:0}
.icon {display:grid; place-items:center; flex:none; width:36px; height:36px; border:1px solid var(--rule); border-radius:12px; background:var(--card); font-size:20px; line-height:1}
.title {flex:1; min-width:0; font-size:15px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.progress-label {flex:none; color:var(--mut); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap}
.progress-label b {color:var(--ink)}
.bar {height:4px; margin:5px 0 7px; border-radius:99px; background:var(--rule); overflow:hidden}
.bar span {display:block; width:0; height:100%; border-radius:inherit; background:var(--tc); transition:width .44s cubic-bezier(.18,.85,.25,1)}
.toolbar {display:flex; align-items:center; gap:7px; min-width:0}
.filters {display:flex; flex:1; min-width:0; gap:6px; overflow-x:auto; scrollbar-width:none}
.filters::-webkit-scrollbar {display:none}
.pill, .tool {flex:none; border:1px solid var(--rule); background:var(--card); border-radius:99px; padding:5px 11px; font-size:13px; font-weight:700; line-height:1.4; white-space:nowrap; transition:transform .25s cubic-bezier(.2,1.5,.4,1),background .2s,color .2s,border-color .2s}
.pill.active {border-color:var(--tc); color:var(--tc); background:color-mix(in srgb,var(--tc) 12%,var(--card))}
.tool.primary {background:var(--tc); border-color:var(--tc); color:white}
.icon {transition:transform .32s cubic-bezier(.22,1.45,.42,1), background-color .2s}
button:active, .icon:active {transform:scale(.95); transition-duration:.09s}
main {max-width:1080px; margin:auto; padding:18px 20px calc(40px + env(safe-area-inset-bottom))}
.summary {display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin:0 3px 12px; color:var(--mut); font-size:13px}
.summary strong {color:var(--ink)}
.question {--accent:var(--tc); min-width:0; padding:20px; background:var(--card); border:1px solid var(--rule); border-radius:22px; box-shadow:var(--shadow); scroll-margin-top:160px}
.question[data-type="multi"] {--accent:#0b8f7a}
.question[data-type="judge"] {--accent:#d9822b}
.question[data-type="blank"] {--accent:#c2255c}
.question[data-type="short"] {--accent:#737d91}
@media (prefers-color-scheme:dark) {
  .question[data-type="multi"] {--accent:#50d7ba}
  .question[data-type="judge"] {--accent:#ffbd68}
  .question[data-type="blank"] {--accent:#ff88b6}
  .question[data-type="short"] {--accent:#b6c2d5}
}
.question-head {display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.type-badge, .status {font-size:12px; font-weight:750; border-radius:99px; padding:3px 10px}
.type-badge {background:color-mix(in srgb,var(--accent) 13%,var(--card)); color:var(--accent)}
.status {color:var(--mut); background:var(--bg)}
.status.good {color:var(--ok); background:var(--okbg)}
.status.bad {color:var(--bad); background:var(--badbg)}
.stem {font-size:16px; line-height:1.85; font-weight:550; white-space:pre-wrap; overflow-wrap:anywhere}
.stem.code {font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; background:var(--bg); border-radius:12px; padding:12px}
figure {margin:0}
figcaption {margin-top:4px; color:var(--mut); font-size:12px}
.options {display:grid; gap:8px; margin-top:15px}
.opt {display:flex; align-items:flex-start; gap:11px; min-height:48px; padding:10px 12px; border:1.5px solid var(--rule); border-radius:15px; cursor:pointer; background-color:var(--card); transition:transform .34s cubic-bezier(.2,1.45,.42,1),border-color .22s,background-color .26s}
.opt:active {transform:scale(.982); transition-duration:.085s,.22s,.26s}
.opt:has(input:focus-visible) {outline:2px solid var(--accent); outline-offset:2px}
.opt input {position:absolute; opacity:0; width:1px; height:1px}
.letter {display:grid; place-items:center; flex:none; width:28px; height:28px; border-radius:9px; background-color:var(--bg); color:var(--mut); font-size:13px; font-weight:800; transition:background-color .24s,color .24s}
.opt::after {content:"✓"; flex:0 0 20px; align-self:center; text-align:center; opacity:0; transform:scale(.55); color:var(--ok); font-size:18px; font-weight:800; transition:opacity .18s,transform .36s cubic-bezier(.18,1.55,.42,1)}
.opt.correct::after,.opt.wrong::after {opacity:1; transform:scale(1)}
.opt.wrong::after {content:"×"; color:var(--bad)}
.blank-input {display:inline-block; min-width:120px; max-width:100%; margin:2px 4px; padding:4px 9px; border:0; border-bottom:2px solid var(--accent); border-radius:8px 8px 0 0; background:color-mix(in srgb,var(--accent) 9%,var(--card)); font-size:16px}
.blank-input.correct {border-color:var(--ok); color:var(--ok)}
.blank-input.wrong {border-color:var(--bad); color:var(--bad)}
textarea {width:100%; min-height:110px; margin-top:15px; padding:12px; border:1.5px solid var(--rule); border-radius:15px; background:transparent; resize:vertical; font-size:16px}
textarea:focus {border-color:var(--accent)}
.note {margin:10px 0 0; color:var(--mut); font-size:13px}
.reveal {display:grid; grid-template-rows:0fr; opacity:0}
.reveal.animate {transition:grid-template-rows .38s cubic-bezier(.22,.8,.25,1),opacity .24s ease-out}
.reveal.open {grid-template-rows:1fr; opacity:1}
.reveal-inner {min-height:0; overflow:hidden}
.result {margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--bg); font-size:14px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere}
.result.good {background:var(--okbg)} .result.bad {background:var(--badbg)}
.empty {padding:45px 20px; text-align:center; color:var(--mut); background:var(--card); border:1px dashed var(--rule); border-radius:22px}
.error {padding:16px; border-radius:16px; background:var(--badbg); color:var(--bad)}
dialog {width:min(680px,calc(100% - 24px)); max-height:min(80dvh,820px); border:1px solid var(--rule); border-radius:24px; padding:0; background:var(--card); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog[open] {animation:dialog-in .32s cubic-bezier(.2,.85,.25,1)}
dialog::backdrop {background:rgba(5,10,20,.45); backdrop-filter:blur(3px); animation:backdrop-in .22s ease-out}
@keyframes backdrop-in {from{opacity:0}to{opacity:1}}
@keyframes dialog-in {from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.dialog-head {position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:15px 18px; background:var(--card); border-bottom:1px solid var(--rule); font-weight:800}
.dialog-body {padding:6px 18px 20px}
.dialog-body h3 {margin:17px 0 8px; font-size:13px; color:var(--mut)}
.dialog-body .note {line-height:1.6}
.dialog-actions {display:flex; flex-wrap:wrap; gap:8px}
.dialog-actions button {min-height:42px; border:1px solid var(--rule); border-radius:13px; background:var(--card); padding:8px 13px; font-size:14px; font-weight:700; transition:transform .25s,background .2s,border-color .2s}
.dialog-actions button.active {border-color:var(--tc); background:color-mix(in srgb,var(--tc) 12%,var(--card)); color:var(--tc)}
.dialog-actions button.danger {color:var(--bad); border-color:var(--bad)}
.dialog-actions button:disabled {opacity:.45}
@media (max-width:600px) {
  .top-inner {padding-left:12px; padding-right:12px}
  .toolbar {flex-wrap:wrap}
  .filters {flex-basis:100%; order:2}
  .tool {padding:5px 10px}
  main {padding:12px 10px calc(30px + env(safe-area-inset-bottom))}
  .question {padding:16px; border-radius:19px; scroll-margin-top:180px}
  .stem {font-size:16px}
  html {scroll-padding-top:185px}
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after {animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important}
}

/* 连续刷题页使用原版题型分组。 */
.section {margin:0 0 22px}
.section h2 {margin:0 3px 10px; color:var(--mut); font-size:14px}
.question-grid {display:grid; grid-template-columns:minmax(0,1fr); align-items:start; gap:14px}
.question[data-type="single"] {--accent:var(--tc)}
.opt .text {flex:1; min-width:0; padding-top:2px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px}
.opt:has(input:checked) {border-color:var(--accent); background-color:color-mix(in srgb,var(--accent) 9%,var(--card))}
.opt:has(input:checked) .letter {background-color:var(--accent); color:#fff}
.opt.correct, .opt.correct:has(input:checked) {border-color:var(--ok); background-color:var(--okbg)}
.opt.correct .letter, .opt.correct:has(input:checked) .letter {background-color:var(--ok); color:#fff}
.opt.wrong, .opt.wrong:has(input:checked) {border-color:var(--bad); background-color:var(--badbg)}
.opt.wrong .letter, .opt.wrong:has(input:checked) .letter {background-color:var(--bad); color:#fff}
.q-images, .answer-images {margin-top:12px; display:grid; gap:10px}
.q-images img, .answer-images img {display:block; max-width:100%; height:auto; border-radius:12px; border:1px solid var(--rule)}
.self-note {margin:10px 0 0; color:var(--mut); font-size:13px}
.jump {width:130px; min-width:0; border:1px solid var(--rule); border-radius:11px; padding:6px 9px; background:var(--card); font-size:13px}
.tool.active {border-color:var(--tc); background:color-mix(in srgb,var(--tc) 12%,var(--card)); color:var(--tc)}
.tool:disabled {opacity:.5}
@media (max-width:600px) {
  .question-grid {gap:10px}
  .jump {width:104px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <a class="icon" href="/" aria-label="返回主页">‹</a>
      <div class="title" id="title">答题页</div>
      <div class="progress-label" id="statsTop">正在加载</div>
      <button class="icon" id="settings" type="button" aria-label="设置">⋯</button>
    </div>
    <div class="bar" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span></span></div>
    <div class="toolbar">
      <div class="filters" id="typeBar" aria-label="题型筛选">
        <button class="pill type-btn active" type="button" data-type-filter="all">全部</button>
        <button class="pill type-btn" type="button" data-type-filter="single">单选</button>
        <button class="pill type-btn" type="button" data-type-filter="multi">多选</button>
        <button class="pill type-btn" type="button" data-type-filter="judge">判断</button>
        <button class="pill type-btn" type="button" data-type-filter="blank">填空</button>
        <button class="pill type-btn" type="button" data-type-filter="short">简答</button>
        <button class="pill" type="button" id="btnFilterUnanswered">未答</button>
        <button class="pill" type="button" id="btnFilterWrong">错题</button>
      </div>
      <input class="jump" id="jumpInput" aria-label="跳题" title="数字=单选，M=多选，J=判断，F=填空，Q=简答。输入后按回车" placeholder="跳题 如 M10">
      <button class="tool" id="btnToggleAnswers" type="button">显示答案</button>
      <button class="tool primary" id="btnGrade" type="button">交卷判分</button>
    </div>
  </div>
</header>
<main>
  <div class="summary"><span id="statusBar">未判分</span><span id="subtitle"></span></div>
  <div id="app"><div class="empty">正在加载题库...</div></div>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle">
  <div class="dialog-head"><span id="dialogTitle">设置</span><button class="icon" id="closeDialog" type="button" aria-label="关闭">×</button></div>
  <div class="dialog-body">
    <h3>筛选和题序</h3>
    <div class="dialog-actions"><button id="btnShowAll" type="button">显示全部</button><button id="btnReshuffle" type="button">重新乱序</button></div>
    <p class="note">乱序只改变显示顺序，答案仍按原始选项判分。</p>
    <h3>作答记录</h3>
    <div class="dialog-actions"><button id="btnClear" type="button">清空作答</button><button class="danger" id="btnReset" type="button">清空本题库保存</button></div>
    <p class="note">作答保存在当前浏览器。</p>
  </div>
</dialog>
<script>

const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LIST_URL = "./data/list.json";
let setId = "";
let setInfo = null;
let rawData = null;
let questions = [];
let answers = {};
let graded = false;
let showAnswers = false;
let filterMode = "all";
let typeFilter = "all";
let seed = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]));
function imageList(q){
  const list = [];
  if(q.image) list.push({src:q.image, caption:q.imageCaption || q.caption || ""});
  if(Array.isArray(q.images)){
    q.images.forEach(item=>{
      if(typeof item === "string") list.push({src:item, caption:""});
      else if(item && item.src) list.push({src:item.src, caption:item.caption || item.title || ""});
    });
  }
  return list;
}
function renderQuestionImages(q){
  const imgs = imageList(q);
  if(!imgs.length) return "";
  return renderImageBlock(imgs, "q-images", q.stem || "题目图片");
}
function mediaListFrom(q, singleKeys, multiKeys){
  const list = [];
  singleKeys.forEach(key=>{
    if(q[key]) list.push({src:q[key], caption:q[`${key}Caption`] || ""});
  });
  multiKeys.forEach(key=>{
    if(Array.isArray(q[key])){
      q[key].forEach(item=>{
        if(typeof item === "string") list.push({src:item, caption:""});
        else if(item && item.src) list.push({src:item.src, caption:item.caption || item.title || ""});
      });
    }
  });
  return list;
}
function renderImageBlock(imgs, className, altText){
  return `<div class="${className}">${imgs.map(img=>`<figure><img src="${esc(img.src)}" alt="${esc(img.caption || altText || "图片")}" loading="lazy"/>${img.caption ? `<figcaption>${esc(img.caption)}</figcaption>` : ""}</figure>`).join("")}</div>`;
}
function renderAnswerImages(q){
  const imgs = mediaListFrom(q, ["answerImage", "solutionImage", "explanationImage"], ["answerImages", "solutionImages", "explanationImages"]);
  if(!imgs.length) return "";
  return renderImageBlock(imgs, "answer-images", "答案图片");
}
const answerKey = () => `quiz_answers_${setId}`;
const seedKey = () => `quiz_seed_${setId}`;
const stateKey = () => `quiz_state_${setId}`;
function readJSON(key, fallback){try{return JSON.parse(localStorage.getItem(key) || "")}catch{return fallback}}
function saveAnswers(){localStorage.setItem(answerKey(), JSON.stringify(answers)); updateStats();}
function saveState(){localStorage.setItem(stateKey(), JSON.stringify({graded,showAnswers,filterMode,typeFilter}));}
function normalizeText(s){return String(s ?? "").trim().replace(/\s+/g," ").toLowerCase();}
function normalizeChoiceAnswer(ans){return String(ans ?? "").toUpperCase().replace(/[^A-Z]/g,"").split("");}
function sameSet(a,b){const aa=[...new Set(a)].sort().join("");const bb=[...new Set(b)].sort().join("");return aa===bb;}
function hashString(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0;}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function shuffleDet(arr, key){const out=[...arr];const rnd=mulberry32(hashString(`${seed}|${key}`));for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out;}
function qKey(type, num, idx){return `${type}:${num ?? idx+1}`;}
function qLabel(type){return {single:"单选",multi:"多选",judge:"判断",blank:"填空",short:"简答"}[type] || type;}
function typeVisible(q){return typeFilter === "all" || q.type === typeFilter;}
function normalizeQuestion(q, type, idx){
  const num = q.num ?? q.id ?? idx + 1;
  let options = q.options;
  if(type === "judge" && !options) options = {A:"对",B:"错"};
  return {...q, type, num, key:qKey(type,num,idx), options};
}
function normalizeData(data){
  if(Array.isArray(data.questions)){
    return data.questions.map((q,idx)=>normalizeQuestion(q, q.type || "single", idx));
  }
  const list=[];
  (data.single||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"single",i)));
  (data.multi||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"multi",i)));
  (data.judge||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"judge",i)));
  (data.blank||data.fill||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"blank",i)));
  (data.short||[]).forEach((q,i)=>list.push(normalizeQuestion(q,"short",i)));
  return list;
}
function getOptions(q){
  const entries = Object.entries(q.options || {});
  const shouldShuffle = setInfo?.shuffleOptions !== false && !(q.type === "judge" && setInfo?.shuffleJudge !== true);
  const ordered = shouldShuffle ? shuffleDet(entries, q.key) : entries;
  return ordered.map(([origKey,text], idx)=>({origKey:String(origKey).toUpperCase(), text, display:LETTERS[idx]}));
}
function correctDisplay(q, opts){
  if(q.type === "short") return String(q.answer ?? q.reference ?? "");
  if(q.type === "blank") return formatBlankAnswer(q);
  const ans = normalizeChoiceAnswer(q.answer);
  return opts.filter(o=>ans.includes(o.origKey)).map(o=>o.display).join("");
}
function userDisplay(q, opts){
  const val = answers[q.key];
  if(q.type === "short") return String(val || "");
  if(q.type === "blank") return Array.isArray(val) ? val.join(" / ") : (val || "");
  const arr = Array.isArray(val) ? val : normalizeChoiceAnswer(val);
  return opts.filter(o=>arr.includes(o.origKey)).map(o=>o.display).join("");
}
function blankExpected(q){
  const src = q.answers ?? q.answer ?? [];
  if(Array.isArray(src)) return src.map(x => Array.isArray(x) ? x.map(String) : [String(x)]);
  return [[String(src)]];
}
function formatBlankAnswer(q){return blankExpected(q).map(x=>x.join(" / ")).join("；");}
function isAnswered(q){
  const val = answers[q.key];
  if(q.type === "multi") return Array.isArray(val) && val.length > 0;
  if(q.type === "blank") return Array.isArray(val) && val.some(x=>String(x||"").trim());
  if(q.type === "short") return String(val || "").trim() !== "";
  return String(val || "").trim() !== "";
}
function isCorrect(q){
  if(q.type === "short") return false;
  if(!isAnswered(q)) return false;
  if(q.type === "multi") return sameSet(answers[q.key] || [], normalizeChoiceAnswer(q.answer));
  if(q.type === "blank"){
    const got = Array.isArray(answers[q.key]) ? answers[q.key] : [answers[q.key]];
    const expected = blankExpected(q);
    if(got.length < expected.length) return false;
    return expected.every((accepts,i)=>accepts.map(normalizeText).includes(normalizeText(got[i])));
  }
  return sameSet([answers[q.key]], normalizeChoiceAnswer(q.answer));
}
function renderStemWithBlanks(q){
  const expected = blankExpected(q);
  let used = 0;
  const stem = esc(q.stem || "").replace(/\{\{blank\}\}|_{3,}/g, () => blankInput(q, used++));
  if(used === 0){
    return stem + `<div style="margin-top:10px">${expected.map((_,i)=>blankInput(q,i)).join(" ")}</div>`;
  }
  while(used < expected.length){ used++; }
  return stem;
}
function blankInput(q, i){
  const vals = Array.isArray(answers[q.key]) ? answers[q.key] : [];
  let cls = "blank-input";
  if(graded && isAnswered(q)){
    const ok = (blankExpected(q)[i] || []).map(normalizeText).includes(normalizeText(vals[i]));
    cls += ok ? " correct" : " wrong";
  }
  return `<input class="${cls}" data-qkey="${esc(q.key)}" data-blank-index="${i}" value="${esc(vals[i] || "")}" placeholder="填空 ${i+1}" />`;
}
function resultClass(q){
  return graded && q.type !== "short" && isAnswered(q) ? (isCorrect(q) ? " good" : " bad") : "";
}
function renderChoiceQuestion(q){
  const opts = getOptions(q);
  const val = answers[q.key];
  const selected = Array.isArray(val) ? val : normalizeChoiceAnswer(val);
  const correctOrig = normalizeChoiceAnswer(q.answer);
  return `<div class="options">${opts.map(o=>{
    const checked = selected.includes(o.origKey) ? "checked" : "";
    const inputType = q.type === "multi" ? "checkbox" : "radio";
    let cls = "opt";
    if((graded || showAnswers) && correctOrig.includes(o.origKey)) cls += " correct";
    if(graded && selected.includes(o.origKey) && !correctOrig.includes(o.origKey)) cls += " wrong";
    return `<label class="${cls}"><input type="${inputType}" name="${esc(q.key)}" data-qkey="${esc(q.key)}" value="${esc(o.origKey)}" ${checked}/><span class="letter">${o.display}</span><span class="text">${esc(o.text)}</span></label>`;
  }).join("")}</div>
  <div class="reveal ${(graded||showAnswers)?"open":""}" aria-hidden="${!(graded||showAnswers)}"><div class="reveal-inner"><div class="result${resultClass(q)}"><b>正确答案：</b>${esc(correctDisplay(q,opts))}　<b>你的答案：</b><span class="user-answer">${esc(userDisplay(q,opts) || "未答")}</span>${q.explanation ? `　<b>解析：</b>${esc(q.explanation)}` : ""}${renderAnswerImages(q)}</div></div></div>`;
}
function renderBlankQuestion(q){
  return `<div class="stem ${q.code ? "code" : ""}">${renderStemWithBlanks(q)}</div>${renderQuestionImages(q)}
  <div class="reveal ${(graded||showAnswers)?"open":""}" aria-hidden="${!(graded||showAnswers)}"><div class="reveal-inner"><div class="result${resultClass(q)}"><b>参考答案：</b>${esc(formatBlankAnswer(q))}　<b>你的答案：</b><span class="user-answer">${esc(userDisplay(q,[]) || "未答")}</span>${q.explanation ? `　<b>解析：</b>${esc(q.explanation)}` : ""}${renderAnswerImages(q)}</div></div></div>`;
}

function renderShortQuestion(q){
  const val = String(answers[q.key] || "");
  const answerText = String(q.answer ?? q.reference ?? "");
  return `<div class="stem ${q.code ? "code" : ""}">${esc(q.stem || "")}</div>${renderQuestionImages(q)}
  <textarea class="short-answer" data-qkey="${esc(q.key)}" placeholder="在这里写你的答案，系统会自动保存。">${esc(val)}</textarea>
  <div class="self-note">简答 / 案例 / 计算题按自评处理，提交后查看参考答案。</div>
  <div class="reveal ${(graded||showAnswers)?"open":""}" aria-hidden="${!(graded||showAnswers)}"><div class="reveal-inner"><div class="result${resultClass(q)}"><b>参考答案：</b>${esc(answerText || "暂无")} ${q.explanation ? `　<b>解析：</b>${esc(q.explanation)}` : ""}${renderAnswerImages(q)}</div></div></div>`;
}
function shouldShowQuestion(q){
  if(!typeVisible(q)) return false;
  if(filterMode === "unanswered" && isAnswered(q)) return false;
  if(filterMode === "wrong" && (q.type === "short" || !graded || !isAnswered(q) || isCorrect(q))) return false;
  return true;
}
function gradeStatus(q){
  return q.type === "short"
    ? (isAnswered(q) ? `<span class="status">已写</span>` : `<span class="status">未写</span>`)
    : (!graded ? "" : (!isAnswered(q) ? `<span class="status">未答</span>` : (isCorrect(q) ? `<span class="status good">正确</span>` : `<span class="status bad">错误</span>`)));
}
function renderQuestion(q, displayNo){
  let cls = "q";
  if(graded && q.type !== "short"){ cls += !isAnswered(q) ? " unanswered" : (isCorrect(q) ? " correct" : " wrong"); }
  let body = "";
  if(q.type === "blank") body = renderBlankQuestion(q);
  else if(q.type === "short") body = renderShortQuestion(q);
  else body = `<div class="stem ${q.code ? "code" : ""}">${esc(q.stem || "")}</div>${renderQuestionImages(q)}${renderChoiceQuestion(q)}`;
  return `<article class="question ${cls}" id="q-${q.type}-${displayNo}" data-type="${esc(q.type)}" data-qkey="${esc(q.key)}">
    <div class="question-head"><div class="type-badge">${qLabel(q.type)} ${esc(displayNo)}</div><div class="q-meta">${q.point || q.tag ? `<span class="status">${esc(q.point || q.tag)}</span> ` : ""}<span class="grade-status">${gradeStatus(q)}</span></div></div>
    ${body}
  </article>`;
}
function groupQuestions(){
  let list = [...questions];
  if(setInfo?.shuffleQuestions) list = shuffleDet(list, "question-order");
  return {
    single:list.filter(q=>q.type==="single"),
    multi:list.filter(q=>q.type==="multi"),
    judge:list.filter(q=>q.type==="judge"),
    blank:list.filter(q=>q.type==="blank"),
    short:list.filter(q=>q.type==="short")
  };
}
function typesetMath(){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear && MathJax.typesetClear();
    MathJax.typesetPromise([$('app')]).catch(err => console.warn('MathJax typeset failed:', err));
  }
}
function render(){
  const groups = groupQuestions();
  const titles = {single:"单选题",multi:"多选题",judge:"判断题",blank:"填空题",short:"简答题"};
  const order = ["single","multi","judge","blank","short"];
  $("app").innerHTML = order.map(type => {
    if(typeFilter !== "all" && typeFilter !== type) return "";
    const items = groups[type].map((q,i)=>({q, displayNo:i+1}));
    const visible = items.filter(({q}) => shouldShowQuestion(q));
    const html = visible.map(({q,displayNo}) => renderQuestion(q, displayNo)).join("");
    if(!groups[type].length || !html) return "";
    return `<div class="section" id="sec-${type}"><h2>${titles[type]}（共 ${groups[type].length} 题）</h2><div class="question-grid">${html}</div></div>`;
  }).join("") || `<div class="note">当前筛选条件下没有题目。</div>`;
  updateControls();
  updateStats();
  typesetMath();
}
function activeQuestions(){return questions.filter(typeVisible);}
function updateControls(){
  document.querySelectorAll("[data-type-filter]").forEach(btn=>{
    const active = btn.dataset.typeFilter === typeFilter;
    btn.classList.toggle("active", active);
    btn.setAttribute("aria-pressed", active);
  });
  $("btnToggleAnswers").textContent = showAnswers ? "隐藏答案" : "显示答案";
  $("btnFilterUnanswered").classList.toggle("active", filterMode === "unanswered");
  $("btnFilterWrong").classList.toggle("active", filterMode === "wrong");
  $("btnFilterUnanswered").setAttribute("aria-pressed", filterMode === "unanswered");
  $("btnFilterWrong").setAttribute("aria-pressed", filterMode === "wrong");
  $("btnShowAll").classList.toggle("active", filterMode === "all");
}
function updateStats(){
  const scope = activeQuestions();
  const total = scope.length;
  const answered = scope.filter(isAnswered).length;
  const objective = scope.filter(q=>q.type !== "short");
  const correct = objective.filter(q=>isAnswered(q)&&isCorrect(q)).length;
  const wrong = objective.filter(q=>isAnswered(q)&&!isCorrect(q)).length;
  const typeName = typeFilter === "all" ? "全部" : qLabel(typeFilter);
  $("statsTop").innerHTML = `<b>${answered}</b> / ${total} 已答`;
  const percent = total ? Math.round(answered / total * 100) : 0;
  $("progress").setAttribute("aria-valuenow", percent);
  $("progress").firstElementChild.style.width = `${percent}%`;
  $("statusBar").innerHTML = graded ? `${typeName} · 正确 <b>${correct}</b> · 错误 <b>${wrong}</b> · 未答 <b>${total-answered}</b>` : `${typeName} · 未判分`;
  $("btnGrade").textContent = graded ? "重新判分" : "交卷判分";
}
function onChoiceChange(input){
  const card = input.closest(".q");
  const q = questions.find(x=>x.key===input.dataset.qkey);
  if(!q) return;
  if(q.type === "multi"){
    answers[q.key] = [...card.querySelectorAll(`input[data-qkey="${CSS.escape(q.key)}"]:checked`)].map(x=>x.value);
  }else{
    answers[q.key] = input.value;
  }
  saveAnswers();
  if (graded || showAnswers) refreshFeedback(card, q, true);
  if (input.checked && !graded) animateBadge(input.closest(".opt").querySelector(".letter"));
}
function onBlankInput(input){
  const q = questions.find(x=>x.key===input.dataset.qkey);
  if(!q) return;
  const expected = blankExpected(q);
  const vals = Array.isArray(answers[q.key]) ? [...answers[q.key]] : Array(expected.length).fill("");
  vals[Number(input.dataset.blankIndex)] = input.value;
  answers[q.key] = vals;
  saveAnswers();
}

function onShortInput(input){
  const q = questions.find(x=>x.key===input.dataset.qkey);
  if(!q) return;
  answers[q.key] = input.value;
  saveAnswers();
}
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function animateBadge(badge, wrong = false){
  if (!badge || reducedMotion.matches) return;
  badge.getAnimations().forEach(animation => animation.cancel());
  const frames = wrong
    ? ["0", "-4px", "3px", "-2px", "0"].map(x => ({transform:`translateX(${x})`}))
    : [.88, 1.13, .98, 1].map(scale => ({transform:`scale(${scale})`}));
  badge.animate(frames, {duration:wrong ? 300 : 360, easing:"cubic-bezier(.18,.8,.3,1)"});
}

function refreshFeedback(card, q, animate = false){
  const revealed = graded || showAnswers;
  const answered = isAnswered(q);
  const correct = graded && answered && isCorrect(q);
  const wrong = graded && answered && !correct && q.type !== "short";
  const correctKeys = normalizeChoiceAnswer(q.answer);
  for (const option of card.querySelectorAll(".opt")){
    const input = option.querySelector("input");
    const correctOption = correctKeys.includes(input.value);
    option.classList.toggle("correct", revealed && correctOption);
    option.classList.toggle("wrong", graded && input.checked && !correctOption);
    if (animate && graded && input.checked) {
      animateBadge(option.querySelector(".letter"), !correctOption);
    }
  }
  if (q.type === "blank"){
    const expected = blankExpected(q);
    for (const input of card.querySelectorAll(".blank-input")){
      const accepted = (expected[Number(input.dataset.blankIndex)] || []).map(normalizeText);
      const matches = accepted.includes(normalizeText(input.value));
      input.classList.toggle("correct", graded && answered && matches);
      input.classList.toggle("wrong", graded && answered && !matches);
    }
  }

  card.classList.toggle("correct", correct);
  card.classList.toggle("wrong", wrong);
  card.classList.toggle("unanswered", graded && !answered && q.type !== "short");
  card.querySelector(".grade-status").innerHTML = gradeStatus(q);
  const result = card.querySelector(".result");
  result.classList.toggle("good", correct);
  result.classList.toggle("bad", wrong);
  const userAnswer = result.querySelector(".user-answer");
  if (userAnswer){
    const answer = userDisplay(q, getOptions(q)) || "未答";
    if (userAnswer.dataset.value !== answer){
      if (q.type === "blank") window.MathJax?.typesetClear?.([userAnswer]);
      userAnswer.textContent = answer;
      userAnswer.dataset.value = answer;
      if (q.type === "blank") window.MathJax?.typesetPromise?.([userAnswer])?.catch(() => {});
    }
  }
}

function updateFeedback(){
  updateControls();
  updateStats();
  if (filterMode === "wrong"){ render(); return; }

  const top = document.querySelector(".top").getBoundingClientRect().bottom;
  const cards = [...$("app").querySelectorAll(".question")];
  const positions = cards.map(card => card.getBoundingClientRect());
  const anchorIndex = positions.findIndex(rect => rect.top >= top);
  const anchorTop = positions[anchorIndex]?.top;
  const byKey = new Map(questions.map(q => [q.key, q]));
  const revealed = graded || showAnswers;
  cards.forEach((card, index) => {
    const rect = positions[index];
    const visible = rect.top < window.innerHeight && rect.bottom > top;
    refreshFeedback(card, byKey.get(card.dataset.qkey), visible);
    const panel = card.querySelector(".reveal");
    panel.classList.toggle("animate", visible && (anchorIndex < 0 || index >= anchorIndex));
    panel.classList.toggle("open", revealed);
    panel.setAttribute("aria-hidden", !revealed);
  });
  if (anchorIndex >= 0){
    const moved = cards[anchorIndex].getBoundingClientRect().top - anchorTop;
    if (Math.abs(moved) > 1) window.scrollBy({top:moved, behavior:"instant"});
  }
}
function getSetIdFromUrl(){
  const params = new URLSearchParams(location.search);
  const fromQuery = params.get("set");
  if(fromQuery) return fromQuery;
  const match = location.pathname.match(/^\/q\/([^/]+)\/?$/);
  if(match) return decodeURIComponent(match[1]);
  return "";
}
async function loadQuiz(){
  setId = getSetIdFromUrl();
  if(!setId){
    $("app").innerHTML = `<div class="error"><b>缺少题库参数。</b><br/>请从 <a href="/">主页</a> 选择题库，或使用 <code>/q/题库ID</code> 打开。旧链接 <code>quiz.html?set=题库ID</code> 仍兼容。</div>`;
    return;
  }
  try{
    const listRes = await fetch(LIST_URL, {cache:"no-store"});
    if(!listRes.ok) throw new Error(`list.json HTTP ${listRes.status}`);
    const list = await listRes.json();
    setInfo = list.find(x=>x.id===setId);
    if(!setInfo) throw new Error(`list.json 中没有找到题库 ID：${setId}`);
    const dataRes = await fetch(setInfo.file, {cache:"no-store"});
    if(!dataRes.ok) throw new Error(`${setInfo.file} HTTP ${dataRes.status}`);
    rawData = await dataRes.json();
    questions = normalizeData(rawData);
    answers = readJSON(answerKey(), {});
    const st = readJSON(stateKey(), {});
    graded = !!st.graded; showAnswers = !!st.showAnswers; filterMode = st.filterMode || "all"; typeFilter = st.typeFilter || "all";
    seed = localStorage.getItem(seedKey());
    if(!seed){ seed = `${Date.now()}-${Math.random()}`; localStorage.setItem(seedKey(), seed); }
    $("title").textContent = rawData.meta?.title || setInfo.title || "答题页";
    document.title = $("title").textContent;
    $("subtitle").textContent = `${setInfo.desc || ""} ${setInfo.shuffleOptions !== false ? "· 选项乱序已开启" : "· 选项固定"}`;
    render();
  }catch(err){
    $("app").innerHTML = `<div class="error"><b>题库加载失败。</b><br/>${esc(err.message)}<br/><br/>检查：1）是否通过服务器访问；2）data/list.json 的 id 和 file 是否正确；3）题库 JSON 是否是合法 JSON。</div>`;
  }
}
document.addEventListener("change", e=>{if(e.target.matches('input[type="radio"],input[type="checkbox"]')) onChoiceChange(e.target);});
document.addEventListener("input", e=>{if(e.target.matches(".blank-input")) onBlankInput(e.target); if(e.target.matches(".short-answer")) onShortInput(e.target);});
document.addEventListener("click", e=>{const btn=e.target.closest("[data-type-filter]"); if(!btn) return; typeFilter=btn.dataset.typeFilter || "all"; saveState(); render();});
$("btnGrade").addEventListener("click",()=>{graded=true;showAnswers=true;saveState();updateFeedback();});
$("btnToggleAnswers").addEventListener("click",()=>{showAnswers=!showAnswers;saveState();updateFeedback();});
$("btnFilterUnanswered").addEventListener("click",()=>{filterMode="unanswered";saveState();render();});
$("btnFilterWrong").addEventListener("click",()=>{filterMode="wrong";saveState();render();});
$("btnShowAll").addEventListener("click",()=>{filterMode="all";saveState();render();});
$("btnClear").addEventListener("click",()=>{answers={};graded=false;saveAnswers();saveState();render();});
$("btnReset").addEventListener("click",()=>{if(confirm("确定清空本题库的作答、判分状态和乱序种子？")){localStorage.removeItem(answerKey());localStorage.removeItem(stateKey());localStorage.removeItem(seedKey());answers={};graded=false;showAnswers=false;filterMode="all";typeFilter="all";seed=`${Date.now()}-${Math.random()}`;localStorage.setItem(seedKey(),seed);render();}});
$("btnReshuffle").addEventListener("click",()=>{if(confirm("重新生成选项/题序乱序？已选答案会保留，但显示位置可能变化。")){seed=`${Date.now()}-${Math.random()}`;localStorage.setItem(seedKey(),seed);render();}});
$("jumpInput").addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const v = e.target.value.trim().toUpperCase(); if(!v) return;
  const m = v.match(/^([SMJFQ])?\s*(\d+)$/); if(!m) return;
  const map = {S:"single",M:"multi",J:"judge",F:"blank",Q:"short"};
  const type = map[m[1] || "S"]; const num = m[2];
  filterMode="all"; typeFilter=type; saveState(); render();
  setTimeout(()=>{const el = $(`q-${type}-${num}`); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});},30);
});
$("settings").addEventListener("click", () => $("dialog").showModal());
$("closeDialog").addEventListener("click", () => $("dialog").close());
$("dialog").addEventListener("click", e => { if(e.target === $("dialog")) $("dialog").close(); });
document.addEventListener("focusout", e => {
  if (!(graded || showAnswers) || !e.target.matches(".blank-input, .short-answer")) return;
  const q = questions.find(item => item.key === e.target.dataset.qkey);
  if (q) refreshFeedback(e.target.closest(".question"), q);
});
loadQuiz();
</script>
</body>
